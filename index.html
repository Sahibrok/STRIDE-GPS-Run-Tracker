/* ============================================================
   STRIDE — 02 · TRACKER
   GPS capture, demo simulation, live session, canvas maps
   ============================================================ */

"use strict";

/* ---------------- map projection helpers ---------------- */

const M_PER_DEG_LAT = 110540;
const M_PER_DEG_LNG = 111320;

function projectPoints(points, w, h, pad = 18) {
  if (!points || !points.length) return { pts: [], metersPerPx: 1 };
  let lat0 = 0, lng0 = 0;
  for (const p of points) { lat0 += p.lat; lng0 += p.lng; }
  lat0 /= points.length; lng0 /= points.length;

  const cosLat = Math.cos((lat0 * Math.PI) / 180) || 1;
  const raw = points.map(p => ({
    x: (p.lng - lng0) * cosLat * M_PER_DEG_LNG,
    y: -(p.lat - lat0) * M_PER_DEG_LAT,
    g: !!p.g
  }));

  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const r of raw) {
    minX = Math.min(minX, r.x); maxX = Math.max(maxX, r.x);
    minY = Math.min(minY, r.y); maxY = Math.max(maxY, r.y);
  }
  const spanX = Math.max(maxX - minX, 1);
  const spanY = Math.max(maxY - minY, 1);
  const availW = Math.max(w - pad * 2, 10);
  const availH = Math.max(h - pad * 2, 10);
  const scale = Math.min(availW / spanX, availH / spanY);
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;

  const pts = raw.map(r => ({
    x: w / 2 + (r.x - cx) * scale,
    y: h / 2 + (r.y - cy) * scale,
    g: r.g
  }));
  return { pts, metersPerPx: 1 / scale };
}

function ensureCanvasSize(canvas) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const w = Math.max(canvas.clientWidth || 300, 10);
  const h = Math.max(canvas.clientHeight || 160, 10);
  const tw = Math.round(w * dpr);
  const th = Math.round(h * dpr);
  if (canvas.width !== tw || canvas.height !== th) {
    canvas.width = tw;
    canvas.height = th;
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

function drawMapBase(ctx, w, h) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "#0C131C");
  g.addColorStop(1, "#080D14");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = "rgba(255,255,255,0.035)";
  ctx.lineWidth = 1;
  const grid = 34;
  ctx.beginPath();
  for (let x = grid; x < w; x += grid) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
  for (let y = grid; y < h; y += grid) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
  ctx.stroke();

  ctx.strokeStyle = "rgba(255,255,255,0.055)";
  ctx.beginPath();
  ctx.moveTo(0, h * 0.62);
  ctx.lineTo(w, h * 0.38);
  ctx.stroke();
}

function drawRoute(ctx, pts, opts = {}) {
  if (!pts.length) return;
  if (pts.length === 1) {
    const p = pts[0];
    ctx.beginPath();
    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = "#C9FF44";
    ctx.fill();
    return;
  }

  const segs = (() => {
    const out = [];
    let cur = [];
    for (const p of pts) {
      if (p.g && cur.length) { out.push(cur); cur = []; }
      cur.push(p);
    }
    if (cur.length) out.push(cur);
    return out.filter(sg => sg.length > 0);
  })();

  const trace = () => {
    ctx.beginPath();
    for (const seg of segs) {
      if (seg.length === 1) {
        ctx.moveTo(seg[0].x, seg[0].y);
        ctx.lineTo(seg[0].x + 0.01, seg[0].y);
        continue;
      }
      ctx.moveTo(seg[0].x, seg[0].y);
      for (let i = 1; i < seg.length; i++) ctx.lineTo(seg[i].x, seg[i].y);
    }
  };

  ctx.lineJoin = "round";
  ctx.lineCap = "round";

  trace();
  ctx.strokeStyle = "rgba(201,255,68,0.16)";
  ctx.lineWidth = 11;
  ctx.stroke();

  trace();
  ctx.strokeStyle = opts.color || "#C9FF44";
  ctx.lineWidth = 3.4;
  ctx.shadowColor = "rgba(201,255,68,0.55)";
  ctx.shadowBlur = 10;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // start marker
  const s = pts[0];
  ctx.beginPath();
  ctx.arc(s.x, s.y, 5.4, 0, Math.PI * 2);
  ctx.fillStyle = "#0B1206";
  ctx.fill();
  ctx.lineWidth = 2.6;
  ctx.strokeStyle = "#C9FF44";
  ctx.stroke();

  // current / end marker
  const e = pts[pts.length - 1];
  if (opts.live) {
    const t = (Date.now() % 1600) / 1600;
    ctx.beginPath();
    ctx.arc(e.x, e.y, 6 + t * 15, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,255,255,${0.35 * (1 - t)})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.arc(e.x, e.y, 5.2, 0, Math.PI * 2);
  ctx.fillStyle = opts.live ? "#FFFFFF" : "#EEF3FA";
  ctx.fill();
  ctx.lineWidth = 2.6;
  ctx.strokeStyle = opts.live ? "#0B1206" : "rgba(201,255,68,0.9)";
  ctx.stroke();
}

function drawMap(canvas, points, opts = {}) {
  const { ctx, w, h } = ensureCanvasSize(canvas);
  drawMapBase(ctx, w, h);
  if (!points || points.length < 1) {
    ctx.fillStyle = "rgba(132,147,166,0.5)";
    ctx.font = "600 11px Inter, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(opts.emptyText || "Waiting for GPS…", w / 2, h / 2 + 4);
    return;
  }
  const { pts, metersPerPx } = projectPoints(points, w, h, 26);
  drawRoute(ctx, pts, opts);
  if (opts.scaleBar !== false && pts.length > 2) {
    const nice = [50, 100, 200, 500, 1000, 2000, 5000];
    let meters = nice[0];
    for (const n of nice) { if (n / metersPerPx <= 76) meters = n; }
    const px = meters / metersPerPx;
    if (px > 16) {
      const x2 = w - 16, y2 = h - 16;
      ctx.strokeStyle = "rgba(238,243,250,0.55)";
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(x2 - px, y2); ctx.lineTo(x2, y2);
      ctx.moveTo(x2 - px, y2 - 3.5); ctx.lineTo(x2 - px, y2 + 3.5);
      ctx.moveTo(x2, y2 - 3.5); ctx.lineTo(x2, y2 + 3.5);
      ctx.stroke();
      ctx.fillStyle = "rgba(238,243,250,0.7)";
      ctx.font = "700 9.5px Inter, system-ui, sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(meters >= 1000 ? `${meters / 1000} km` : `${meters} m`, x2, y2 - 7);
    }
  }
}

/** small inline SVG thumbnail for run list items */
function routeThumbSVG(points, size = 58) {
  if (!points || points.length < 2) {
    return `<svg viewBox="0 0 ${size} ${size}"><rect width="${size}" height="${size}" fill="#0A1119"/><path d="M14 42c8-18 16-6 30-26" fill="none" stroke="rgba(201,255,68,0.35)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 4"/></svg>`;
  }
  const { pts } = projectPoints(points, size, size, 11);
  let d = "";
  pts.forEach((p, i) => {
    const move = i === 0 || p.g;
    d += `${move ? "M" : "L"}${p.x.toFixed(1)} ${p.y.toFixed(1)} `;
  });
  const s = pts[0], e = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${size} ${size}" preserveAspectRatio="xMidYMid meet">
    <rect width="${size}" height="${size}" fill="#0C141D"/>
    <path d="${d}" fill="none" stroke="rgba(201,255,68,0.20)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${d}" fill="none" stroke="#C9FF44" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${s.x.toFixed(1)}" cy="${s.y.toFixed(1)}" r="2.5" fill="#0C141D" stroke="#C9FF44" stroke-width="1.5"/>
    <circle cx="${e.x.toFixed(1)}" cy="${e.y.toFixed(1)}" r="2.3" fill="#EEF3FA"/>
  </svg>`;
}

/* ---------------- demo route generator ---------------- */

function makeDemoRoute(totalMeters = 5000, seed = 1, paceSecPerKm = 360) {
  const startLat = 25.4484 + (Math.random() - 0.5) * 0.006;
  const startLng = 81.8390 + (Math.random() - 0.5) * 0.006;
  const r = totalMeters / (2 * Math.PI);
  const cosLat = Math.cos((startLat * Math.PI) / 180) || 1;
  const n = 320;
  const angle0 = Math.random() * Math.PI * 2;
  const pts = [];

  for (let i = 0; i <= n; i++) {
    const a = angle0 + (i / n) * Math.PI * 2;
    const wobble = 1 + 0.16 * Math.sin(3 * a + seed) + 0.06 * Math.sin(7 * a + seed * 2.1);
    const rad = r * wobble;
    pts.push({
      lat: startLat + (rad * Math.sin(a)) / M_PER_DEG_LAT,
      lng: startLng + (rad * Math.cos(a)) / (M_PER_DEG_LAT * cosLat),
      alt: 118 + 11 * Math.sin(2 * a + 0.7) + 4 * Math.sin(5 * a + 1.3)
    });
  }

  // timestamps from real travelled distance — evenly paced with a natural drift
  let t = Date.now();
  let dist = 0;
  pts[0].t = t;
  for (let i = 1; i < pts.length; i++) {
    dist += haversine(pts[i - 1], pts[i]);
    const drift = 1 + 0.05 * Math.sin(i / 22 + seed);
    t += (haversine(pts[i - 1], pts[i]) / 1000) * paceSecPerKm * 1000 * drift;
    pts[i].t = Math.round(t);
  }
  return pts;
}

/* ---------------- helpers for live stats ---------------- */

function pointsUpToTime(trackPts, targetT, t0) {
  // returns array of points with t <= targetT, plus an interpolated head
  const out = [];
  for (let i = 0; i < trackPts.length; i++) {
    const p = trackPts[i];
    if (p.t <= targetT) { out.push(p); continue; }
    if (out.length) {
      const prev = trackPts[i - 1];
      const span = Math.max(p.t - prev.t, 1);
      const f = clamp((targetT - prev.t) / span, 0, 1);
      out.push({
        lat: prev.lat + (p.lat - prev.lat) * f,
        lng: prev.lng + (p.lng - prev.lng) * f,
        alt: (prev.alt ?? 0) + ((p.alt ?? 0) - (prev.alt ?? 0)) * f,
        t: targetT,
        g: !!p.g
      });
    }
    break;
  }
  if (!out.length) out.push({ ...trackPts[0], t: t0 });
  return out;
}

/* ---------------- session ---------------- */

const ACTIVE_KEY = "stride.active.v1";

class LiveSession {
  constructor(mode, opts = {}) {
    this.mode = mode;                 // 'gps' | 'demo'
    this.target = opts.target || null; // { km, title }
    this.status = "running";
    this.points = [];
    this.watchId = null;
    this.wallStart = Date.now();
    this.accMs = 0;
    this.speedMult = 1;
    this.track = null;
    this.trackT0 = null;
    this.gpsAccuracy = null;
    this.gpsError = null;
    this.gpsReady = false;
    this.lastSplitMeter = 0;
    this.cues = new Set();
    this.finished = false;
    this.startISO = new Date().toISOString();
    this.timer = null;
    this.wakeLock = null;
    this.lastSave = 0;
  }

  elapsedMs() {
    const base = this.accMs + (this.status === "running" ? Date.now() - this.wallStart : 0);
    return base * (this.mode === "demo" ? this.speedMult : 1);
  }

  async start() {
    $("#liveModeBadge").className = "badge " + (this.mode === "gps" ? "badge-gps warn" : "badge-demo");
    $("#liveModeBadge").textContent = this.mode === "gps" ? "Locating…" : "Demo mode";
    $("#liveDot").style.display = "";
    $("#ctrlPause").className = "ctrl ctrl-pause";
    $("#ctrlPause").innerHTML = icon("pause") + "<span>Pause</span>";
    $("#pausedVeil").classList.add("hidden");
    $("#nextCue").textContent = "";

    if (this.target) {
      $("#liveTarget").textContent = `Target · ${fmtDist1(this.target.km * 1000)} ${unitDef().label} · ${this.target.title}`;
      $("#liveTarget").classList.remove("hidden");
    } else {
      $("#liveTarget").classList.add("hidden");
    }

    if (this.mode === "demo") {
      const km = this.target ? clamp(this.target.km, 1, 12) : 5;
      this.track = makeDemoRoute(km * 1000, Math.random() * 10, 360);
      this.trackT0 = this.track[0].t;
      this.points = [this.track[0]];
      $("#liveModeBadge").className = "badge badge-demo";
      $("#liveModeBadge").textContent = "Demo mode";
      speak(this.target
        ? `Demo run started. ${this.target.km} kilometers planned.`
        : "Demo run started. Enjoy your run.");
    } else {
      this.bindWatch();
      speak(this.target
        ? `Run started. ${this.target.km} kilometers planned.`
        : "Run started. Enjoy your run.");
    }

    requestWakeLock(this);
    this.timer = setInterval(() => this.tick(), 250);
    this.tick();
  }

  bindWatch() {
    if (!("geolocation" in navigator)) {
      this.gpsError = "unsupported";
      this.onGpsProblem();
      return;
    }
    try {
      this.watchId = navigator.geolocation.watchPosition(
        pos => this.onPosition(pos),
        err => this.onGpsError(err),
        { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 }
      );
    } catch (e) {
      this.gpsError = "unsupported";
      this.onGpsProblem();
    }
  }

  onPosition(pos) {
    const { latitude, longitude, accuracy, altitude } = pos.coords;
    this.gpsAccuracy = accuracy;
    const accurate = !accuracy || accuracy <= 35;
    const badge = $("#liveModeBadge");

    if (!this.gpsReady) {
      if (accurate) {
        this.gpsReady = true;
        if (badge) { badge.className = "badge badge-gps"; badge.textContent = "GPS locked"; }
        beep(880, 0.09);
        speak("GPS locked. Your run is being recorded.");
      } else if (badge) {
        badge.className = "badge badge-gps warn";
        badge.textContent = accuracy ? `Locating ±${Math.round(accuracy)} m` : "Locating…";
      }
    } else if (badge) {
      badge.className = "badge " + (accurate ? "badge-gps" : "badge-gps warn");
      badge.textContent = `GPS ±${Math.round(accuracy || 0)} m`;
    }

    if (!this.gpsReady || this.status !== "running") return;
    if (accuracy && accuracy > 45) return;

    const p = {
      lat: latitude,
      lng: longitude,
      t: pos.simTime || Date.now(),
      alt: typeof altitude === "number" ? altitude : null,
      acc: accuracy
    };
    const last = this.points[this.points.length - 1];
    if (last) {
      const d = haversine(last, p);
      const dt = Math.max((p.t - last.t) / 1000, 0.5);
      if (d < 1.4) return;                        // jitter while standing still
      if (d / dt > 12) p.g = true;                // impossible speed → don't connect the line
    }
    this.points.push(p);
    this.tick();
  }

  /** used by the built-in GPS simulator for testing on desktop */
  injectPoint(lat, lng, accuracy = 8, t = null) {
    this.simulated = true;
    this.onPosition({
      coords: { latitude: lat, longitude: lng, accuracy, altitude: 120 + Math.sin(lat * 900) * 8 },
      simTime: t
    });
  }

  onGpsError(err) {
    this.gpsError = err && err.code === 1 ? "denied" : "unavailable";
    this.onGpsProblem();
  }

  onGpsProblem() {
    if (this.finished) return;
    this.pause();
    const denied = this.gpsError === "denied";
    showDialog({
      title: denied ? "Location permission needed" : "GPS is taking too long",
      text: denied
        ? "STRIDE needs location access to record your route. Allow location for this site in your browser settings, or explore the app in demo mode."
        : "We couldn't get a GPS fix. Move to an open area and try again, or explore the app in demo mode with a simulated route.",
      actions: [
        { label: "Try again", style: "btn-ghost", onClick: () => restartSession(this.mode, this.target, this) },
        { label: "Demo mode", style: "btn-primary", onClick: () => restartSession("demo", this.target, this) }
      ]
    });
  }

  pause() {
    if (this.status !== "running") return;
    this.accMs += Date.now() - this.wallStart;
    this.status = "paused";
    this.updatePauseUI();
    $("#pausedVeil").classList.remove("hidden");
    beep(520, 0.08);
    speak("Paused.");
  }

  resume() {
    if (this.status !== "paused") return;
    this.wallStart = Date.now();
    this.status = "running";
    this.updatePauseUI();
    $("#pausedVeil").classList.add("hidden");
    beep(760, 0.08);
    speak("Resumed.");
  }

  togglePause() { this.status === "running" ? this.pause() : this.resume(); }

  updatePauseUI() {
    const btn = $("#ctrlPause");
    if (this.status === "paused") {
      btn.className = "ctrl ctrl-resume";
      btn.innerHTML = icon("play") + "<span>Resume</span>";
    } else {
      btn.className = "ctrl ctrl-pause";
      btn.innerHTML = icon("pause") + "<span>Pause</span>";
    }
  }

  setSpeed(mult) {
    this.speedMult = mult;
    $$("#speedSwitch button").forEach(b => b.classList.toggle("on", Number(b.dataset.mult) === mult));
  }

  stats() {
    const elapsed = this.elapsedMs() / 1000;
    let points = this.points;
    let distM = pathDistance(points);
    let duration = elapsed;

    if (this.mode === "demo" && this.track) {
      const targetT = this.trackT0 + this.elapsedMs();
      points = pointsUpToTime(this.track, targetT, this.trackT0);
      this.points = points;
      distM = pathDistance(points);
      duration = Math.max(0, (points[points.length - 1].t - this.trackT0) / 1000);
      if (points.length && points[points.length - 1].t >= this.track[this.track.length - 1].t) {
        if (this.status === "running") {
          this.pause();
          toast("Demo route complete — tap Finish to save your run");
        }
      }
    } else if (this.simulated && points.length > 1) {
      duration = Math.max(0, (points[points.length - 1].t - points[0].t) / 1000);
    }

    const pace = distM > 20 ? pacePerUnit(distM, duration) : null;
    const splits = computeSplits(points, unitDef().m);
    const whole = splits.splits.filter(s => !s.partial);
    const lastSplit = whole[whole.length - 1] || null;
    const gain = elevationGain(points);
    return { distM, duration, pace, splits: whole, lastSplit, gain, points };
  }

  tick() {
    if (this.finished) return;
    const s = this.stats();

    $("#liveDist").textContent = fmtDist(s.distM, 2);
    $("#liveTime").textContent = fmtTime(s.duration);
    $("#livePace").textContent = fmtPace(s.pace);
    $("#liveSplits").textContent = s.splits.length ? String(s.splits.length) : "—";
    $("#liveCal").textContent = String(caloriesFor(s.distM, s.duration));
    $("#liveGain").textContent = String(Math.round(s.gain));

    drawMap($("#liveMap"), s.points, { live: this.status === "running" });

    // ----- target / split progress line -----
    const label = unitDef().label;
    if (this.target) {
      const left = this.target.km * 1000 - s.distM;
      if (left <= 0) {
        $("#nextCue").textContent = `Target complete — ${fmtDist1(s.distM)} ${label} done`;
        if (!this.cues.has("target")) {
          this.cues.add("target");
          speak(`Target distance reached. Great running. ${fmtDist1(s.distM)} kilometers.`);
          beep(980, 0.14);
        }
      } else {
        const nextKm = (s.splits.length + 1) * unitDef().m;
        const toSplit = nextKm - s.distM;
        $("#nextCue").textContent = `${fmtDist1(left)} ${label} to target · next split in ${Math.max(0, Math.round(toSplit))} m`;
      }
    } else {
      const nextKm = (s.splits.length + 1) * unitDef().m;
      const toSplit = nextKm - s.distM;
      $("#nextCue").textContent = s.distM < 15
        ? (this.mode === "gps" ? "Waiting for GPS movement…" : "Simulating route…")
        : `Next ${label} split in ${Math.max(0, Math.round(toSplit))} m`;
    }

    // ----- split announcements -----
    if (s.lastSplit && s.lastSplit.index > this.lastSplitMeter) {
      this.lastSplitMeter = s.lastSplit.index;
      const paceTxt = fmtPace(pacePerUnit(s.lastSplit.meters, s.lastSplit.seconds));
      const unitWord = state.settings.units === "mi" ? "mile" : "kilometer";
      $("#lastSplit").textContent = `Last split · ${paceTxt}${unitDef().pace}`;
      beep(880, 0.1);
      speak(`${s.lastSplit.index} ${unitWord}. ${paceSpeech(pacePerUnit(s.lastSplit.meters, s.lastSplit.seconds))}.`);
    }

    if (Date.now() - this.lastSave > 5000) {
      this.lastSave = Date.now();
      this.persist();
    }
  }

  persist() {
    if (this.mode !== "gps") return;
    try {
      store.set(ACTIVE_KEY, JSON.stringify({
        startISO: this.startISO,
        target: this.target,
        points: this.points,
        accMs: this.accMs,
        status: "paused"
      }));
    } catch (e) {}
  }

  stopWatch() {
    if (this.watchId != null) {
      try { navigator.geolocation.clearWatch(this.watchId); } catch (e) {}
      this.watchId = null;
    }
  }

  finish() {
    this.finished = true;
    this.stopWatch();
    clearInterval(this.timer);
    this.timer = null;
    store.del(ACTIVE_KEY);
    releaseWakeLock(this);
    try { if ("speechSynthesis" in window) window.speechSynthesis.cancel(); } catch (e) {}

    const s = this.stats();
    const run = {
      id: "run_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      date: this.startISO,
      distM: Math.round(s.distM * 10) / 10,
      durS: Math.round(s.duration),
      points: s.points.map(p => {
        const out = {
          lat: +p.lat.toFixed(6),
          lng: +p.lng.toFixed(6),
          t: p.t,
          alt: typeof p.alt === "number" ? +p.alt.toFixed(1) : null
        };
        if (p.g) out.g = 1;
        return out;
      }),
      mode: this.mode,
      target: this.target,
      calories: caloriesFor(s.distM, s.duration)
    };

    if (run.distM < 30 || run.durS < 10) {
      return { discarded: true };
    }

    state.runs.push(run);
    const autoDone = markWorkoutDoneAuto(run);
    saveState();
    beep(1040, 0.16);
    setTimeout(() => beep(1320, 0.18), 130);
    speak(`Run complete. ${fmtDistSpeech(run.distM)} in ${fmtTimeSpeech(run.durS)}. Nice work.`);
    return { run, autoDone };
  }

  discard() {
    this.finished = true;
    this.stopWatch();
    clearInterval(this.timer);
    this.timer = null;
    store.del(ACTIVE_KEY);
    releaseWakeLock(this);
    try { if ("speechSynthesis" in window) window.speechSynthesis.cancel(); } catch (e) {}
  }
}

function fmtDistSpeech(meters) {
  return `${fmtDist1(meters)} kilometers`;
}

/* ---------------- wake lock ---------------- */

async function requestWakeLock(session) {
  try {
    if ("wakeLock" in navigator && document.visibilityState === "visible") {
      session.wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (e) {}
}
function releaseWakeLock(session) {
  try { if (session.wakeLock) session.wakeLock.release(); } catch (e) {}
  session.wakeLock = null;
}

/* ---------------- session controller (bridge to app.js) ---------------- */

let liveSession = null;

function openLiveScreen() {
  document.body.classList.add("is-running");
  $$(".screen").forEach(s => s.classList.remove("active"));
  $("#screen-live").classList.add("active");
}

function closeLiveScreen() {
  document.body.classList.remove("is-running");
  $("#pausedVeil").classList.add("hidden");
  switchTab("run");
}

async function beginSession(mode, target) {
  if (liveSession) { try { liveSession.discard(); } catch (e) {} }
  liveSession = new LiveSession(mode, { target });
  ui.pendingTarget = target || null;
  openLiveScreen();
  $("#liveUnit").textContent = unitDef().label.toUpperCase();
  $("#liveDist").textContent = "0.00";
  $("#liveTime").textContent = "00:00";
  $("#livePace").textContent = "--'--\"";
  $("#liveSplits").textContent = "—";
  $("#liveCal").textContent = "0";
  $("#liveGain").textContent = "0 m";
  $("#lastSplit").textContent = "Waiting for first split";
  $$("#speedSwitch button").forEach(b => b.classList.toggle("on", Number(b.dataset.mult) === 1));
  drawMap($("#liveMap"), [], { emptyText: mode === "gps" ? "Acquiring GPS…" : "Starting demo…" });
  await liveSession.start();
}

function restartSession(mode, target, oldSession) {
  if (oldSession) { try { oldSession.discard(); } catch (e) {} }
  beginSession(mode, target || null);
}

function finishSession() {
  if (!liveSession) return;
  const s = liveSession.stats();
  if (s.distM < 30 || s.duration < 10) {
    showDialog({
      title: "This run is very short",
      text: "Save it anyway? Short runs under 30 m or 10 seconds are usually accidental starts.",
      actions: [
        { label: "Discard", style: "btn-danger", onClick: () => { liveSession.discard(); liveSession = null; closeLiveScreen(); } },
        { label: "Save run", style: "btn-primary", onClick: () => doFinish() }
      ]
    });
    return;
  }
  doFinish();
}

function doFinish() {
  const result = liveSession.finish();
  liveSession = null;
  closeLiveScreen();
  if (result && result.discarded) {
    toast("Run discarded");
    return;
  }
  if (result && result.run) {
    if (result.autoDone) toast(`Training plan updated — ${result.autoDone.title} complete`);
    renderHistory();
    renderStats();
    renderPlan();
    renderRunTab();
    openRunSummary(result.run.id);
  }
}

/* ---------------- active-run recovery ---------------- */

function checkUnfinishedRun() {
  let raw = null;
  try { raw = store.get(ACTIVE_KEY); } catch (e) {}
  if (!raw) return;
  let data = null;
  try { data = JSON.parse(raw); } catch (e) { store.del(ACTIVE_KEY); return; }
  if (!data || !Array.isArray(data.points) || data.points.length < 2) { store.del(ACTIVE_KEY); return; }
  const distM = pathDistance(data.points);
  if (distM < 30) { store.del(ACTIVE_KEY); return; }

  showDialog({
    title: "Unfinished run found",
    text: `A run from ${fmtDate(data.startISO)} (${fmtDist1(distM)} ${unitDef().label}) wasn't saved. Finish and save it?`,
    actions: [
      { label: "Discard", style: "btn-danger", onClick: () => store.del(ACTIVE_KEY) },
      {
        label: "Save run", style: "btn-primary", onClick: () => {
          const last = data.points[data.points.length - 1];
          const first = data.points[0];
          const dur = Math.max(1, (last.t - first.t) / 1000);
          const run = {
            id: "run_" + Date.now().toString(36),
            date: data.startISO,
            distM: Math.round(distM * 10) / 10,
            durS: Math.round(dur),
            points: data.points,
            mode: "gps",
            target: data.target || null,
            calories: caloriesFor(distM, dur)
          };
          state.runs.push(run);
          markWorkoutDoneAuto(run);
          saveState();
          store.del(ACTIVE_KEY);
          renderAll();
          openRunSummary(run.id);
          toast("Recovered run saved");
        }
      }
    ]
  });
}


/* ---------------- built-in test harness (desktop QA) ---------------- */

window.StrideTest = {
  simulateGps(totalMeters = 2000, paceSecPerKm = 360) {
    if (!liveSession || liveSession.mode !== "gps") {
      beginSession("gps", null).then(() => {
        setTimeout(() => window.StrideTest.simulateGps(totalMeters, paceSecPerKm), 500);
      });
      return;
    }
    // stop the real GPS watcher so simulated fixes don't mix with real ones
    liveSession.stopWatch();
    liveSession.simulated = true;
    if (liveSession.points.length) liveSession.points = [];

    const origin = { lat: 28.6139, lng: 77.209 };
    const cosLat = Math.cos((origin.lat * Math.PI) / 180);
    const r = totalMeters / (2 * Math.PI);
    const total = 60;
    const t0 = Date.now();
    let i = 0;
    let traveled = 0;
    let prev = null;

    const iv = setInterval(() => {
      const a = (i / total) * Math.PI * 2;
      const rad = r * (1 + 0.13 * Math.sin(3 * a) + 0.05 * Math.sin(7 * a));
      const lat = origin.lat + (rad * Math.sin(a)) / M_PER_DEG_LAT;
      const lng = origin.lng + (rad * Math.cos(a)) / (M_PER_DEG_LAT * cosLat);
      if (prev) traveled += haversine(prev, { lat, lng });
      const simT = t0 + (traveled / 1000) * paceSecPerKm * 1000;
      if (liveSession) liveSession.injectPoint(lat, lng, 7, simT);
      prev = { lat, lng };
      i++;
      if (i > total) clearInterval(iv);
    }, 120);
  }
};

function ringMarkup(size, radius, stroke, pct, gradId) {
  const c = 2 * Math.PI * radius;
  const off = c * (1 - clamp(pct, 0, 1));
  return `<svg viewBox="0 0 ${size} ${size}">
    <defs>
      <linearGradient id="${gradId}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#DCFF80"/>
        <stop offset="0.55" stop-color="#C9FF44"/>
        <stop offset="1" stop-color="#8FE22F"/>
      </linearGradient>
    </defs>
    <circle class="ring-track" cx="${size / 2}" cy="${size / 2}" r="${radius}" stroke-width="${stroke}"/>
    <circle class="ring-arc" cx="${size / 2}" cy="${size / 2}" r="${radius}"
      stroke-width="${stroke}"
      style="stroke:url(#${gradId})"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
  </svg>`;
}

/* ---------------- charts ---------------- */

function drawBarChart(canvas, values, labels, opts = {}) {
  const { ctx, w, h } = ensureCanvasSize(canvas);
  ctx.clearRect(0, 0, w, h);
  const padT = 24, padB = 22, padL = 8, padR = 8;
  const chartH = Math.max(h - padT - padB, 10);
  const n = values.length;
  const maxV = Math.max(...values, opts.minMax || 1) || 1;
  const slot = (w - padL - padR) / Math.max(n, 1);
  const barW = Math.min(30, slot * 0.52);

  // baseline
  ctx.strokeStyle = "rgba(255,255,255,0.09)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padL, h - padB + 0.5);
  ctx.lineTo(w - padR, h - padB + 0.5);
  ctx.stroke();

  // guide line at max
  ctx.setLineDash([3, 4]);
  ctx.strokeStyle = "rgba(255,255,255,0.07)";
  ctx.beginPath();
  ctx.moveTo(padL, padT);
  ctx.lineTo(w - padR, padT);
  ctx.stroke();
  ctx.setLineDash([]);

  values.forEach((v, i) => {
    const bh = Math.max((v / maxV) * chartH, v > 0 ? 3 : 1.5);
    const x = padL + slot * i + (slot - barW) / 2;
    const y = h - padB - bh;
    const isLast = i === n - 1;
    const isPeak = v === maxV && v > 0;

    const g = ctx.createLinearGradient(0, y, 0, h - padB);
    if (isLast) {
      g.addColorStop(0, "#D9FF74");
      g.addColorStop(1, "rgba(201,255,68,0.35)");
    } else if (isPeak) {
      g.addColorStop(0, "rgba(201,255,68,0.75)");
      g.addColorStop(1, "rgba(201,255,68,0.14)");
    } else {
      g.addColorStop(0, "rgba(255,255,255,0.34)");
      g.addColorStop(1, "rgba(255,255,255,0.07)");
    }
    ctx.fillStyle = g;
    const r = Math.min(barW / 2, 6);
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(x, y, barW, bh, [r, r, 3, 3]);
    } else {
      ctx.rect(x, y, barW, bh);
    }
    ctx.fill();

    if (v > 0) {
      ctx.fillStyle = isLast ? "#E9FFB0" : "rgba(195,207,222,0.75)";
      ctx.font = "800 9.5px Inter, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(v.toFixed(1), x + barW / 2, y - 6);
    }

    ctx.fillStyle = isLast ? "#C9FF44" : "rgba(132,147,166,0.85)";
    ctx.font = `${isLast ? "800" : "600"} 9px Inter, system-ui, sans-serif`;
    ctx.textAlign = "center";
    ctx.fillText(labels[i], x + barW / 2, h - 7);
  });
}

function drawPaceLine(canvas, series, opts = {}) {
  const { ctx, w, h } = ensureCanvasSize(canvas);
  ctx.clearRect(0, 0, w, h);
  if (series.length < 2) {
    ctx.fillStyle = "rgba(132,147,166,0.55)";
    ctx.font = "600 11.5px Inter, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Log two runs to see your pace trend", w / 2, h / 2);
    return;
  }

  const padT = 18, padB = 20, padL = 44, padR = 12;
  const values = series.map(s => s.value);
  let minV = Math.min(...values);
  let maxV = Math.max(...values);
  const span = Math.max(maxV - minV, 20);
  minV -= span * 0.25;
  maxV += span * 0.25;

  const xAt = i => padL + (i / (series.length - 1)) * (w - padL - padR);
  const yAt = v => padT + ((v - minV) / (maxV - minV)) * (h - padT - padB);

  // grid
  ctx.font = "600 9px Inter, system-ui, sans-serif";
  ctx.textAlign = "right";
  for (let i = 0; i <= 2; i++) {
    const v = minV + ((maxV - minV) / 2) * i;
    const y = yAt(v);
    ctx.strokeStyle = "rgba(255,255,255,0.06)";
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 4]);
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(w - padR, y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "rgba(132,147,166,0.75)";
    ctx.fillText(fmtPace(v), padL - 7, y + 3);
  }

  const pts = series.map((s, i) => ({ x: xAt(i), y: yAt(s.value) }));

  // area
  const grad = ctx.createLinearGradient(0, padT, 0, h - padB);
  grad.addColorStop(0, "rgba(201,255,68,0.22)");
  grad.addColorStop(1, "rgba(201,255,68,0)");
  ctx.beginPath();
  ctx.moveTo(pts[0].x, h - padB);
  pts.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.lineTo(pts[pts.length - 1].x, h - padB);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // line
  ctx.beginPath();
  pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
  ctx.strokeStyle = "#C9FF44";
  ctx.lineWidth = 2.4;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.shadowColor = "rgba(201,255,68,0.5)";
  ctx.shadowBlur = 9;
  ctx.stroke();
  ctx.shadowBlur = 0;

  pts.forEach((p, i) => {
    const last = i === pts.length - 1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, last ? 4.4 : 2.8, 0, Math.PI * 2);
    ctx.fillStyle = last ? "#FFFFFF" : "#0C131C";
    ctx.fill();
    ctx.strokeStyle = "#C9FF44";
    ctx.lineWidth = last ? 2.4 : 1.8;
    ctx.stroke();
  });

  ctx.textAlign = "left";
  ctx.fillStyle = "rgba(132,147,166,0.75)";
  ctx.font = "600 9px Inter, system-ui, sans-serif";
  ctx.fillText(series[0].label, padL, h - 5);
  ctx.textAlign = "right";
  ctx.fillText(series[series.length - 1].label, w - padR, h - 5);
  ctx.textAlign = "left";
  ctx.fillStyle = "rgba(201,255,68,0.9)";
  ctx.font = "800 9px Inter, system-ui, sans-serif";
  ctx.fillText("faster ↑", padL, 11);
}

/* ---------------- plan ---------------- */

function planRaceDate(plan) {
  const start = mondayOf(new Date(plan.startISO));
  return new Date(start.getTime() + (plan.weeks - 1) * 7 * DAY_MS + 6 * DAY_MS);
}

function weekDateRange(plan, weekIdx) {
  const start = new Date(mondayOf(new Date(plan.startISO)).getTime() + weekIdx * 7 * DAY_MS);
  const end = new Date(start.getTime() + 6 * DAY_MS);
  return `${start.getDate()} ${MONTHS[start.getMonth()]} – ${end.getDate()} ${MONTHS[end.getMonth()]}`;
}

    </div>`;
  }).join("");

  $("#planBody").innerHTML = `
    <div class="screen-head">
      <h1 class="screen-title">Training</h1>

function openRunDetail(runId) {
  const run = state.runs.find(r => r.id === runId);
  if (!run) return;
  ui.detailRunId = runId;
  const u = unitDef().label;
  const pace = runPace(run);
  const { splits } = computeSplits(run.points, unitDef().m);
  const whole = splits.filter(s => !s.partial);
  const gain = elevationGain(run.points);
  const maxPace = whole.length ? Math.max(...whole.map(s => s.seconds)) : 0;
  const bestPace = whole.length ? Math.min(...whole.map(s => s.seconds)) : 0;

  const paces = splits.map(s => pacePerUnit(s.meters, s.seconds));
  const minP = Math.min(...paces);
  const maxP = Math.max(...paces);
  const splitsHtml = splits.length ? splits.map(s => {
    const pace = pacePerUnit(s.meters, s.seconds);
    const w = maxP > minP ? 100 - ((pace - minP) / (maxP - minP)) * 48 : 100;
    const isBest = !s.partial && s.seconds === bestPace && whole.length > 1;
    return `<div class="split-row ${isBest ? "best" : ""}">
      <span class="si">${s.index}</span>
      <span class="sbar"><i style="width:${w}%"></i></span>
      <span class="st">${fmtPace(pacePerUnit(s.meters, s.seconds))}</span>
      <span class="sp">${s.partial ? `+${Math.round(s.meters)} m` : `${fmtDist1(s.meters)} ${u}`}</span>

  $("#sheetDetailBody").innerHTML = `
    <div class="sheet-head">

        <div class="sheet-title">${timeOfDayName(run.date)}</div>

      <div class="dstat"><div class="v num">${fmtDist(run.distM)}<small>${u}</small></div><div class="l">Distance</div></div>
      <div class="dstat"><div class="v num">${fmtTime(run.durS)}</div><div class="l">Moving time</div></div>

function openRunSummary(runId) {
  const run = state.runs.find(r => r.id === runId);

  const pace = runPace(run);

/* ---------------- sample data ---------------- */

function makeRunAt(dateISO, km, paceSecPerKm, seed) {
  const route = makeDemoRoute(km * 1000, seed, paceSecPerKm);
  const shift = new Date(dateISO).getTime() - route[0].t;
  const pts = route.map(p => ({
    lat: +p.lat.toFixed(6),
    lng: +p.lng.toFixed(6),
    t: p.t + shift,
    alt: typeof p.alt === "number" ? +p.alt.toFixed(1) : null
  }));
  const durS = Math.round((pts[pts.length - 1].t - pts[0].t) / 1000);
  return {
    id: "run_" + Math.floor(Math.random() * 1e9).toString(36),
    date: new Date(pts[0].t).toISOString(),
    distM: Math.round(pathDistance(pts) * 10) / 10,
    durS,
    points: pts,
    mode: "demo",
    sample: true,
    target: null,
    calories: caloriesFor(km * 1000, durS)
  };
}

function loadSampleData() {
  const today = new Date();
  const thisMonday = mondayOf(today);
  const todayIdx = dayIndexMon(today);           // 0 = Monday
  const runs = [];

  // 8 weeks of history. Current week is filled only up to today, so the
  // progress ring and the week-over-week insight always have real data.
  const weekDays = [0, 2, 4, 5];                 // Mon, Wed, Fri, Sat
  const baseKm = [4, 5, 6.5, 3.5];
  let seed = 1;

  for (let w = 7; w >= 0; w--) {
    const weekStart = new Date(thisMonday.getTime() - w * 7 * DAY_MS);
    const progressIdx = 7 - w;                   // 1..8 — later weeks run a bit more
    const growth = 0.72 + 0.06 * progressIdx;
    const pace = 432 - progressIdx * 7;          // 7 s/km faster each week

    weekDays.forEach((d, i) => {
      if (w === 0 && d > todayIdx) return;       // don't log runs in the future
      const km = Math.round(baseKm[i] * growth * 2) / 2;
      const date = new Date(weekStart.getTime() + d * DAY_MS);
      date.setHours(i % 2 === 0 ? 6 : 18, 10 + ((seed * 7) % 40), 0, 0);
      runs.push(makeRunAt(date.toISOString(), km, pace + (i % 2 ? 6 : -4), seed++));
    });
  }

  // if today is Monday, make sure the current week isn't empty
  if (!runs.some(r => new Date(r.date) >= thisMonday)) {
    const d = new Date();
    d.setHours(6, 30, 0, 0);
    runs.push(makeRunAt(d.toISOString(), 5, 378, 99));
  }

  state.runs = [...state.runs.filter(r => !r.sample), ...runs];
  state.runs.sort((a, b) => new Date(a.date) - new Date(b.date));

  // start a plan a few weeks ago so week 3–4 is "current"
  if (!state.plan) {
    const start = new Date(today.getTime() - 3 * 7 * DAY_MS);
    const p = generatePlan("10k", "intermediate", 8, start, { baseLongKm: recentLongestKm() });
    const curWeek = planWeekIndex(p);
    for (const wk of p.workouts) {
      if (wk.week < curWeek && wk.type !== "race" && Math.random() > 0.18) {
        p.done[workoutKey(wk)] = true;
      }
    }
    state.plan = p;
  }

  saveState();
  renderAll();
  toast("Sample data loaded");
}

"use strict";

/* ---------------- install prompt ---------------- */

let deferredInstall = null;

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredInstall = e;
  const row = $("#installRow");
  if (row) row.classList.remove("hidden");
});

async function installApp() {
  if (deferredInstall) {
    deferredInstall.prompt();
    try {
      const res = await deferredInstall.userChoice;
      if (res && res.outcome === "accepted") toast("Installing STRIDE…");
    } catch (e) {}
    deferredInstall = null;
    return;
  }
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  showDialog({
    title: "Add STRIDE to your home screen",
    text: isIOS
      ? "Tap the Share button in Safari, then choose “Add to Home Screen”. STRIDE then opens full-screen and works offline."
      : "Open your browser menu (⋮) and choose “Install app” or “Add to Home screen”. STRIDE then opens full-screen and works offline.",
    actions: [{ label: "Got it", style: "btn-primary" }]
  });
}

/* ---------------- tabs ---------------- */

function switchTab(name) {
  ui.tab = name;
  $$("#tabbar .tab").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  $$(".screen").forEach(s => s.classList.toggle("active", s.id === "screen-" + name));
  const renderers = { run: renderRunTab, history: renderHistory, stats: renderStats, plan: renderPlan };
  if (renderers[name]) renderers[name]();
  updateHeader();
  const main = $("#main");
  if (main) main.scrollTop = 0;
}

function renderAll() {
  updateHeader();
  renderRunTab();
  renderHistory();
  renderStats();
  renderPlan();
  if (ui.tab) switchTab(ui.tab);
}

/* ---------------- sheets ---------------- */

function openSheet(sel) {
  $$(".sheet").forEach(s => s.classList.remove("open"));
  const el = $(sel);
  if (!el) return;
  $("#overlay").classList.add("show");
  requestAnimationFrame(() => el.classList.add("open"));
}

function closeSheets() {
  $$(".sheet").forEach(s => s.classList.remove("open"));
  if (!$("#modalOnboard").classList.contains("open") &&
      !$("#modalDialog").classList.contains("open")) {
    $("#overlay").classList.remove("show");
  }
}

/* ---------------- plan actions ---------------- */

function findWorkout(week, day) {
  if (!state.plan) return null;
  return state.plan.workouts.find(w => w.week === Number(week) && w.day === Number(day)) || null;
}

function toggleWorkout(week, day) {
  const w = findWorkout(week, day);
  if (!w) return;
  const key = workoutKey(w);
  const plan = state.plan;
  plan.done[key] = !plan.done[key];
  saveState();
  renderPlan();
  renderRunTab();
  toast(plan.done[key] ? `Ticked off: ${w.title}` : `Unmarked: ${w.title}`);
}

function createPlanFromDraft() {
  const build = () => {
    state.plan = generatePlan(planDraft.race, planDraft.level, planDraft.weeks, new Date(), { baseLongKm: recentLongestKm() });
    saveState();
    closeSheets();
    renderPlan();
    renderRunTab();
    updateHeader();
    toast("Plan ready — week 1 starts Monday");
  };
  if (state.plan) {
    showDialog({
      title: "Replace your current plan?",
      text: "Your progress on the existing plan will be cleared. Your recorded runs stay untouched.",
      actions: [
        { label: "Cancel", style: "btn-ghost" },
        { label: "Replace plan", style: "btn-primary", onClick: build }
      ]
    });
  } else {
    build();
  }
}

function deletePlan() {
  showDialog({
    title: "End this training plan?",
    text: "The plan and its ticked sessions will be removed. Your runs are not affected.",
    actions: [
      { label: "Keep plan", style: "btn-ghost" },
      {
        label: "End plan", style: "btn-danger",
        onClick: () => {
          state.plan = null;
          saveState();
          renderPlan();
          renderRunTab();
          toast("Training plan ended");
        }
      }
    ]
  });
}

function deleteRun(id) {
  const run = state.runs.find(r => r.id === id);
  if (!run) return;
  showDialog({
    title: "Delete this run?",
    text: `${fmtDist1(run.distM)} ${unitDef().label} on ${fmtDate(run.date)} will be permanently removed.`,
    actions: [
      { label: "Cancel", style: "btn-ghost" },
      {
        label: "Delete", style: "btn-danger",
        onClick: () => {
          state.runs = state.runs.filter(r => r.id !== id);
          saveState();
          closeSheets();
          renderAll();
          toast("Run deleted");
        }
      }
    ]
  });
}

/* ---------------- global click handling ---------------- */

function handleAction(act, el) {
  const id = el.dataset.id;
  switch (act) {
    case "tab":
      switchTab(el.dataset.tab);
      break;
    case "start-run":
      beginSession("gps", null);
      break;
    case "start-demo":
      beginSession("demo", null);
      break;
    case "start-workout": {
      const w = findWorkout(el.dataset.week, el.dataset.day);
      if (!w) return;
      beginSession("gps", { km: w.km, title: w.title });
      break;
    }
    case "toggle-workout":
      toggleWorkout(el.dataset.week, el.dataset.day);
      break;
    case "toggle-week":
      ui.planOpenWeek = ui.planOpenWeek === Number(el.dataset.week) ? null : Number(el.dataset.week);
      renderPlan();
      break;
    case "open-plan-sheet":
      openPlanSheet();
      break;
    case "create-plan":
      createPlanFromDraft();
      break;
    case "delete-plan":
      deletePlan();
      break;
    case "open-detail":
      openRunDetail(id);
      break;
    case "view-detail":
      closeSheets();
      setTimeout(() => openRunDetail(id), 260);
      break;
    case "delete-run":
      deleteRun(id);
      break;
    case "close-sheet":
      closeSheets();
      break;
    case "open-settings":
      renderSettings();
      openSheet("#sheetSettings");
      break;
    case "toggle-voice": {
      state.settings.voice = !state.settings.voice;
      saveState();
      renderSettings();
      toast(state.settings.voice ? "Voice coach on" : "Voice coach off");
      break;
    }
    case "export-data":
      exportData();
      break;
    case "sample-data":
      loadSampleData();
      break;
    case "reset-data":
      resetAll();
      break;
    case "install-app":
      installApp();
      break;
    case "finish-onboarding":
      finishOnboarding();
      break;
    case "toggle-pause":
      if (liveSession) liveSession.togglePause();
      break;
    case "resume-run":
      if (liveSession) liveSession.resume();
      break;
    case "finish-run":
      finishSession();
      break;
    default:
      break;
  }
}

document.addEventListener("click", e => {
  // tab bar
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn && tabBtn.closest("#tabbar")) {
    switchTab(tabBtn.dataset.tab);
    return;
  }
  // speed switcher (live)
  const speedBtn = e.target.closest("#speedSwitch button");
  if (speedBtn && liveSession) {
    liveSession.setSpeed(Number(speedBtn.dataset.mult));
    return;
  }
  // onboarding goal chips
  const goalChip = e.target.closest("[data-obgoal]");
  if (goalChip) {
    const nameInput = $("#obName");
    if (nameInput) ob.name = nameInput.value;
    ob.goalIdx = Number(goalChip.dataset.obgoal);
    renderOnboarding();
    return;
  }
  // stepper controls
  const stepBtn = e.target.closest(".stepper[data-step] button");
  if (stepBtn) {
    const step = stepBtn.closest(".stepper").dataset.step;
    const dir = Number(stepBtn.dataset.dir);
    if (step === "goal") {
      const unitStep = state.settings.units === "mi" ? 1 : 2;
      setGoalDisplay(goalDisplay() + dir * unitStep);
      renderSettings();
      renderRunTab();
      renderStats();
    } else if (step === "weight") {
      state.settings.weightKg = clamp(state.settings.weightKg + dir, 35, 180);
      saveState();
      renderSettings();
    }
    return;
  }
  // segmented pickers
  const segBtn = e.target.closest(".segmented[data-seg] button");
  if (segBtn) {
    const seg = segBtn.closest(".segmented");
    const name = seg.dataset.seg;
    const val = segBtn.dataset.val;
    if (name === "units") {
      state.settings.units = val;
      saveState();
      renderSettings();
      renderAll();
    } else if (name === "obUnits") {
      const nameInput = $("#obName");
      if (nameInput) ob.name = nameInput.value;
      ob.units = val;
      ob.goalIdx = Math.min(ob.goalIdx, 2);
      renderOnboarding();
    } else if (name === "race" || name === "level" || name === "weeks") {
      planDraft[name] = name === "weeks" ? Number(val) : val;
      renderPlanSheet();
    }
    return;
  }
  // generic actions
  const actEl = e.target.closest("[data-act]");
  if (actEl) {
    try {
      handleAction(actEl.dataset.act, actEl);
    } catch (err) {
      console.error("Action failed:", actEl.dataset.act, err);
      toast("Something went wrong — please try again");
    }
  }
});

/* ---------------- text inputs ---------------- */

document.addEventListener("input", e => {
  if (e.target.id === "setName") {
    state.settings.name = e.target.value;
    saveState();
  }
  if (e.target.id === "obName") {
    ob.name = e.target.value;
  }
});

document.addEventListener("change", e => {
  if (e.target.id === "setName") {
    renderRunTab();
  }
});

/* ---------------- overlay / escape ---------------- */

$("#overlay").addEventListener("click", () => {
  if ($("#modalOnboard").classList.contains("open")) return;
  closeSheets();
  closeDialog();
});

document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("#modalOnboard").classList.contains("open")) return;
  closeSheets();
  closeDialog();
});

/* ---------------- onboarding completion ---------------- */

function finishOnboarding() {
  const nameInput = $("#obName");
  if (nameInput) ob.name = nameInput.value.trim();
  state.settings.name = ob.name;
  state.settings.units = ob.units;
  state.settings.weeklyGoalKm = obGoalKm();
  state.onboarded = true;
  saveState();
  $("#modalOnboard").classList.remove("open");
  $("#overlay").classList.remove("show");
  renderAll();
  toast(`Welcome${ob.name ? ", " + ob.name : ""} — ready when you are`);
}

/* ---------------- live-run housekeeping ---------------- */

window.addEventListener("resize", () => {
  clearTimeout(window.__strideResize);
  window.__strideResize = setTimeout(() => {
    if (liveSession && document.body.classList.contains("is-running")) {
      liveSession.tick();
    }
    if (ui.tab === "stats") renderStats();
    const dm = $("#detailMap");
    if (dm && $("#sheetDetail").classList.contains("open")) {
      const run = state.runs.find(r => r.id === ui.detailRunId);
      if (run) drawMap(dm, run.points, { scaleBar: true });
    }
    const sm = $("#summaryMap");
    if (sm && $("#sheetSummary").classList.contains("open")) {
      const run = state.runs.find(r => r.id === ui.summaryRunId);
      if (run) drawMap(sm, run.points, { scaleBar: false });
    }
  }, 260);
});

window.addEventListener("pagehide", () => {
  if (liveSession && !liveSession.finished) liveSession.persist();
});

window.addEventListener("beforeunload", e => {
  if (liveSession && !liveSession.finished && liveSession.status === "running") {
    e.preventDefault();
    e.returnValue = "";
  }
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && liveSession && !liveSession.finished) {
    liveSession.persist();
  }
});

/* ---------------- bootstrap ---------------- */

function init() {
  loadState();
  ui.planOpenWeek = null;
  renderAll();
  switchTab("run");

  // service worker (offline support) — fails silently in sandboxed previews
  try {
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      /* service worker unavailable in single-file build */
    }
  } catch (e) {}

  // prime speech voices
  try {
    if ("speechSynthesis" in window) window.speechSynthesis.getVoices();
  } catch (e) {}

  if (!state.onboarded) {
    setTimeout(openOnboarding, 260);
  } else {
    setTimeout(checkUnfinishedRun, 500);
  }
}

init();

</script>
</body>
</html>
