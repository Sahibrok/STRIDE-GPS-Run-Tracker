/* ============================================================
   STRIDE — GPS Run Tracker
   Design system: dark "midnight runner" with volt accent
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

:root {
  --bg: #06090E;
  --bg-1: #0A0F16;
  --card: #101823;
  --card-2: #141E2B;
  --line: rgba(255, 255, 255, 0.075);
  --line-strong: rgba(255, 255, 255, 0.13);
  --txt: #EEF3FA;
  --txt-2: #C3CFDE;
  --muted: #8493A6;
  --volt: #C9FF44;
  --volt-2: #A6F03B;
  --volt-soft: rgba(201, 255, 68, 0.13);
  --orange: #FF8A4C;
  --blue: #63C8FF;
  --pink: #FF6B9A;
  --red: #FF6169;
  --r-lg: 22px;
  --r-md: 16px;
  --r-sm: 12px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
}

html, body { height: 100%; }

body {
  margin: 0;
  background: #04060A;
  color: var(--txt);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
  overscroll-behavior: none;
}

body::before {
  content: "";
  position: fixed;
  inset: -20%;
  background:
    radial-gradient(38% 30% at 18% 8%, rgba(201, 255, 68, 0.10), transparent 65%),
    radial-gradient(42% 36% at 88% 16%, rgba(74, 144, 255, 0.11), transparent 62%),
    radial-gradient(50% 40% at 50% 105%, rgba(255, 122, 69, 0.07), transparent 65%);
  pointer-events: none;
  z-index: 0;
}

button, input, select { font-family: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; -webkit-tap-highlight-color: transparent; }
input, select { outline: none; }
svg { display: block; }

/* ---------- App shell ---------- */

#app {
  position: relative;
  z-index: 1;
  max-width: 480px;
  height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: linear-gradient(180deg, #080D14 0%, #070B11 38%, #05080D 100%);
}

@media (min-width: 560px) {
  #app {
    border-left: 1px solid rgba(255, 255, 255, 0.05);
    border-right: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: 0 0 90px rgba(0, 0, 0, 0.7);
  }
}

/* ---------- Top bar ---------- */

.topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: calc(14px + var(--safe-t)) 18px 10px;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }

.brand-mark {
  width: 40px; height: 40px;
  border-radius: 13px;
  display: grid; place-items: center;
  background: linear-gradient(140deg, var(--volt) 0%, var(--volt-2) 55%, #7BD52F 100%);
  color: #08110A;
  box-shadow: 0 8px 22px rgba(201, 255, 68, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.55);
  flex: 0 0 auto;
}

.brand-name {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
}

.brand-sub {
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  margin-top: 2px;
}

.top-actions { display: flex; align-items: center; gap: 8px; }

.chip-streak {
  display: flex; align-items: center; gap: 5px;
  height: 34px; padding: 0 11px;
  border-radius: 11px;
  background: rgba(255, 138, 76, 0.10);
  border: 1px solid rgba(255, 138, 76, 0.22);
  color: var(--orange);
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.chip-streak svg { width: 15px; height: 15px; }
.chip-streak.zero { opacity: 0.55; }

.icon-btn {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 13px;
  color: var(--txt-2);
  background: rgba(255, 255, 255, 0.045);
  border: 1px solid var(--line);
  transition: background 0.18s ease, transform 0.1s ease;
}
.icon-btn:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.09); }
.icon-btn svg { width: 19px; height: 19px; }

/* ---------- Main / screens ---------- */

#main {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 4px 16px 28px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
#main::-webkit-scrollbar { display: none; }

.screen { display: none; padding-bottom: 8px; }
.screen.active { display: block; animation: screenIn 0.32s cubic-bezier(0.22, 0.61, 0.36, 1); }

@keyframes screenIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}

.screen-head { padding: 8px 2px 14px; }
.screen-title {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.15;
  margin: 0;
}
.screen-sub { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }

/* ---------- Tab bar ---------- */

.tabbar {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2px;
  padding: 8px 10px calc(8px + var(--safe-b));
  background: rgba(8, 12, 18, 0.86);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-top: 1px solid var(--line);
  transition: transform 0.28s ease, opacity 0.2s ease;
}

.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 7px 0 5px;
  border-radius: 13px;
  color: #67768A;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.045em;
  text-transform: uppercase;
  transition: color 0.18s ease, background 0.18s ease;
}
.tab svg { width: 21px; height: 21px; stroke-width: 1.9; }
.tab.active { color: var(--volt); background: rgba(201, 255, 68, 0.07); }
.tab:active { transform: scale(0.95); }

/* ---------- Generic UI ---------- */

.card {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.012)), var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px;
  position: relative;
}

.card + .card, .card + .section, .section + .card, .section + .section { margin-top: 14px; }

.section { margin-top: 18px; }
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding: 0 4px 10px;
}
.section-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0;
}

.micro {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

.big-num {
  font-size: 46px;
  font-weight: 800;
  letter-spacing: -0.035em;
  line-height: 1;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  width: 100%;
  height: 52px;
  border-radius: 16px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
  transition: transform 0.1s ease, filter 0.18s ease, background 0.18s ease;
}
.btn:active { transform: scale(0.975); }
.btn svg { width: 18px; height: 18px; }

.btn-primary {
  background: linear-gradient(140deg, #D9FF74 0%, var(--volt) 45%, #A9EF35 100%);
  color: #0A1205;
  box-shadow: 0 12px 30px rgba(201, 255, 68, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.5);
}
.btn-primary:active { filter: brightness(0.95); }

.btn-ghost {
  background: rgba(255, 255, 255, 0.045);
  border: 1px solid var(--line-strong);
  color: var(--txt);
}
.btn-ghost:active { background: rgba(255, 255, 255, 0.08); }

.btn-danger {
  background: rgba(255, 97, 105, 0.10);
  border: 1px solid rgba(255, 97, 105, 0.26);
  color: #FF8087;
}

.btn-sm { height: 42px; border-radius: 13px; font-size: 13.5px; }

.link-btn {
  color: var(--volt);
  font-weight: 700;
  font-size: 13px;
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px;
}
.link-btn svg { width: 14px; height: 14px; }

/* ---------- Run tab (idle) ---------- */

.hero-card {
  overflow: hidden;
  padding: 18px 18px 20px;
  background:
    radial-gradient(120% 90% at 50% -20%, rgba(201, 255, 68, 0.14), transparent 62%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.012)),
    var(--card);
}
.hero-card::after {
  content: "";
  position: absolute;
  width: 240px; height: 240px;
  right: -110px; top: -120px;
  border-radius: 50%;
  border: 1px solid rgba(201, 255, 68, 0.10);
  box-shadow: 0 0 0 34px rgba(201, 255, 68, 0.035), 0 0 0 68px rgba(201, 255, 68, 0.02);
  pointer-events: none;
}

.hero-top { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }

.ring-wrap {
  position: relative;
  width: 196px;
  height: 196px;
  margin: 18px auto 16px;
  display: grid;
  place-items: center;
}
.ring-wrap svg { width: 196px; height: 196px; transform: rotate(-90deg); }
.ring-track { fill: none; stroke: rgba(255, 255, 255, 0.07); stroke-width: 11; }
.ring-arc {
  fill: none;
  stroke: url(#ringGrad);
  stroke-width: 11;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.9s cubic-bezier(0.22, 0.61, 0.36, 1);
  filter: drop-shadow(0 0 9px rgba(201, 255, 68, 0.45));
}
.ring-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  text-align: center;
}
.ring-center .unit { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.ring-center .big-num { font-size: 46px; }

.start-cta { display: flex; flex-direction: column; gap: 9px; position: relative; z-index: 1; }

.quick-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 14px;
}
.stat-tile {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01)), var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 13px 13px 12px;
  min-width: 0;
}
.stat-tile .val {
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stat-tile .val small { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0; margin-left: 2px; }
.stat-tile .lab { margin-top: 3px; font-size: 9.5px; letter-spacing: 0.11em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stat-tile .val .accent { color: var(--volt); }

.today-card { display: flex; align-items: center; gap: 14px; }
.today-icon {
  width: 48px; height: 48px; flex: 0 0 auto;
  border-radius: 15px;
  display: grid; place-items: center;
  background: var(--volt-soft);
  border: 1px solid rgba(201, 255, 68, 0.22);
  color: var(--volt);
}
.today-icon svg { width: 22px; height: 22px; }
.today-body { flex: 1 1 auto; min-width: 0; }
.today-kicker { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.today-title { font-size: 16px; font-weight: 700; letter-spacing: -0.015em; margin-top: 1px; }
.today-meta { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.today-go {
  flex: 0 0 auto;
  height: 38px;
  padding: 0 15px;
  border-radius: 12px;
  background: var(--volt);
  color: #0A1205;
  font-weight: 800;
  font-size: 13px;
  display: flex; align-items: center; gap: 6px;
}
.today-go svg { width: 15px; height: 15px; }
.today-go:active { transform: scale(0.95); }

.insight-card {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 15px 16px;
}
.insight-ico {
  width: 34px; height: 34px; flex: 0 0 auto;
  border-radius: 11px;
  display: grid; place-items: center;
  background: rgba(99, 200, 255, 0.11);
  color: var(--blue);
  border: 1px solid rgba(99, 200, 255, 0.2);
}
.insight-ico svg { width: 17px; height: 17px; }
.insight-body { min-width: 0; }
.insight-title { font-size: 13.5px; font-weight: 700; letter-spacing: -0.01em; }
.insight-text { font-size: 12.5px; color: var(--muted); margin-top: 1px; }

/* ---------- Live run ---------- */

.is-running .topbar { display: none; }
.is-running #main { padding: 0; overflow: hidden; }
.is-running .tabbar { transform: translateY(110%); opacity: 0; pointer-events: none; position: absolute; bottom: 0; left: 0; right: 0; }

#screen-live { height: 100%; }
#screen-live.active { display: block; }
.run-live {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: radial-gradient(120% 60% at 50% 0%, rgba(201, 255, 68, 0.07), transparent 60%), #070B11;
  animation: screenIn 0.3s ease;
}

.live-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(12px + var(--safe-t)) 16px 8px;
}
.live-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--volt);
  box-shadow: 0 0 0 0 rgba(201, 255, 68, 0.55);
  animation: livePulse 1.8s ease-out infinite;
}
@keyframes livePulse {
  0% { box-shadow: 0 0 0 0 rgba(201, 255, 68, 0.5); }
  70% { box-shadow: 0 0 0 9px rgba(201, 255, 68, 0); }
  100% { box-shadow: 0 0 0 0 rgba(201, 255, 68, 0); }
}
.live-label { font-size: 11px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--volt); }
.live-head .spacer { flex: 1; }

.badge {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 5px 9px;
  border-radius: 8px;
  white-space: nowrap;
}
.badge-demo { background: rgba(255, 138, 76, 0.14); color: var(--orange); border: 1px solid rgba(255, 138, 76, 0.28); }
.badge-gps { background: rgba(201, 255, 68, 0.1); color: var(--volt); border: 1px solid rgba(201, 255, 68, 0.22); }
.badge-gps.warn { background: rgba(255, 138, 76, 0.1); color: var(--orange); border-color: rgba(255, 138, 76, 0.25); }

.map-wrap {
  position: relative;
  flex: 1 1 auto;
  min-height: 170px;
  margin: 4px 14px 0;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #0A1017;
}
.map-wrap canvas { width: 100%; height: 100%; display: block; }
.map-scale {
  position: absolute;
  right: 12px; bottom: 12px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--txt-2);
  background: rgba(8, 12, 18, 0.72);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 4px 7px;
  backdrop-filter: blur(6px);
}

.live-panel { flex: 0 0 auto; padding: 14px 18px 0; }
.live-main {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 8px;
}
.live-dist {
  font-size: 74px;
  font-weight: 800;
  letter-spacing: -0.05em;
  line-height: 0.92;
  background: linear-gradient(180deg, #FFFFFF 30%, #C7D4E4 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.live-unit { font-size: 13px; font-weight: 800; letter-spacing: 0.1em; color: var(--muted); padding-bottom: 9px; }

.live-substats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}
.live-substat {
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 11px 4px 10px;
  text-align: center;
}
.live-substat .v { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; }
.live-substat .l { font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-top: 2px; }

.live-extras {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-top: 9px;
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.live-extras b { color: var(--txt-2); font-weight: 700; }

.speed-switch {
  display: flex;
  gap: 2px;
  padding: 2px;
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--line);
}
.speed-switch button {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.03em;
  color: var(--muted);
  padding: 3px 7px;
  border-radius: 7px;
}
.speed-switch button.on { background: var(--orange); color: #170A03; }

.last-split {
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--volt);
  margin-top: 10px;
  letter-spacing: 0.01em;
}

.next-cue {
  text-align: center;
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 9px;
  min-height: 16px;
}

.live-controls {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: 1fr 1.35fr;
  gap: 10px;
  padding: 12px 18px calc(18px + var(--safe-b));
}
.ctrl {
  height: 62px;
  border-radius: 19px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.ctrl svg { width: 20px; height: 20px; }
.ctrl:active { transform: scale(0.97); }
.ctrl-pause { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line-strong); color: var(--txt); }
.ctrl-resume { background: var(--volt); color: #0A1205; box-shadow: 0 10px 26px rgba(201, 255, 68, 0.22); }
.ctrl-finish { background: linear-gradient(140deg, #FF8A5C, #FF5C61); color: #1A0508; box-shadow: 0 10px 26px rgba(255, 97, 105, 0.22); }

.paused-veil {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(4, 7, 11, 0.78);
  backdrop-filter: blur(4px);
  display: grid;
  place-items: center;
  text-align: center;
  padding: 30px;
}
.paused-veil .pt { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
.paused-veil .ps { color: var(--muted); font-size: 13px; margin-top: 4px; }

/* ---------- History ---------- */

.month-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 16px 4px 8px;
}

.run-item {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 12px;
  border-radius: var(--r-md);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.008)), var(--card);
  border: 1px solid var(--line);
  transition: background 0.16s ease, transform 0.1s ease;
  width: 100%;
  text-align: left;
}
.run-item + .run-item { margin-top: 9px; }
.run-item:active { transform: scale(0.99); background: var(--card-2); }

.run-thumb {
  width: 58px; height: 58px;
  flex: 0 0 auto;
  border-radius: 13px;
  overflow: hidden;
  background: #0A1119;
  border: 1px solid var(--line);
}
.run-thumb svg { width: 100%; height: 100%; }
.run-mid { flex: 1 1 auto; min-width: 0; }
.run-title { font-size: 14.5px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.run-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.run-right { flex: 0 0 auto; text-align: right; }
.run-right .d { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
.run-right .d small { font-size: 10px; font-weight: 700; color: var(--muted); margin-left: 1px; }
.run-right .p { font-size: 11px; color: var(--muted); margin-top: 1px; }

.summary-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

/* ---------- Stats ---------- */

.goal-card { display: flex; align-items: center; gap: 16px; }
.goal-ring-sm { width: 92px; height: 92px; position: relative; flex: 0 0 auto; display: grid; place-items: center; }
.goal-ring-sm svg { width: 92px; height: 92px; transform: rotate(-90deg); position: absolute; inset: 0; }
.goal-ring-sm .ring-track { stroke-width: 8; }
.goal-ring-sm .ring-arc { stroke-width: 8; }
.goal-ring-sm .pct { font-size: 19px; font-weight: 800; letter-spacing: -0.03em; }
.goal-info { flex: 1 1 auto; min-width: 0; }
.goal-info .gt { font-size: 16px; font-weight: 700; letter-spacing: -0.015em; }
.goal-info .gs { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.goal-info .gs b { color: var(--txt-2); }

.chart-card { padding: 16px 14px 10px; }
.chart-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 6px; }
.chart-title { font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
.chart-sub { font-size: 11px; color: var(--muted); }
.chart-box { position: relative; height: 168px; }
.chart-box canvas { width: 100%; height: 100%; display: block; }

.pb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pb-card {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01)), var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 14px;
}
.pb-ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; margin-bottom: 9px; }
.pb-ico svg { width: 15px; height: 15px; }
.pb-val { font-size: 19px; font-weight: 800; letter-spacing: -0.03em; white-space: nowrap; }
.pb-val small { font-size: 10.5px; font-weight: 700; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
.pb-lab { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-top: 3px; }
.pb-date { font-size: 10px; color: #5F6E82; margin-top: 4px; }

.insights-list { display: flex; flex-direction: column; gap: 9px; }

/* ---------- Plan ---------- */

.plan-hero {
  background:
    radial-gradient(110% 110% at 0% 0%, rgba(99, 200, 255, 0.13), transparent 55%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.012)),
    var(--card);
  overflow: hidden;
}
.plan-race { display: flex; align-items: center; gap: 12px; }
.plan-badge {
  width: 52px; height: 52px;
  border-radius: 16px;
  display: grid; place-items: center;
  background: rgba(99, 200, 255, 0.12);
  border: 1px solid rgba(99, 200, 255, 0.24);
  color: var(--blue);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: -0.02em;
  flex: 0 0 auto;
}
.plan-race-t { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
.plan-race-s { font-size: 12.5px; color: var(--muted); margin-top: 1px; }

.progress-bar {
  height: 7px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.07);
  overflow: hidden;
  margin-top: 14px;
}
.progress-fill {
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--volt-2), var(--volt));
  transition: width 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);
}
.plan-progress-meta { display: flex; justify-content: space-between; margin-top: 7px; font-size: 11px; color: var(--muted); }

.week-card { padding: 15px 16px; }
.week-card.current { border-color: rgba(201, 255, 68, 0.28); box-shadow: 0 0 0 1px rgba(201, 255, 68, 0.08), 0 12px 30px rgba(0, 0, 0, 0.3); }
.week-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.week-name { font-size: 14px; font-weight: 800; letter-spacing: -0.01em; }
.week-tag { font-size: 10px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; color: var(--blue); background: rgba(99, 200, 255, 0.1); padding: 3px 7px; border-radius: 6px; }
.week-tag.taper { color: var(--orange); background: rgba(255, 138, 76, 0.1); }
.week-tag.race { color: var(--volt); background: var(--volt-soft); }
.week-tag.now { color: #0A1205; background: var(--volt); }

.workout-row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 2px;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
}
.workout-row:first-of-type { border-top: 0; }
.w-check {
  width: 26px; height: 26px;
  flex: 0 0 auto;
  border-radius: 9px;
  border: 1.5px solid var(--line-strong);
  display: grid; place-items: center;
  color: transparent;
  transition: all 0.16s ease;
}
.w-check svg { width: 14px; height: 14px; }
.w-check.done { background: var(--volt); border-color: var(--volt); color: #0A1205; }
.w-check.today { border-color: var(--volt); box-shadow: 0 0 0 3px rgba(201, 255, 68, 0.12); }
.w-body { flex: 1 1 auto; min-width: 0; }
.w-title { font-size: 13.5px; font-weight: 700; letter-spacing: -0.01em; }
.w-title.done { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(132, 147, 166, 0.5); }
.w-meta { font-size: 11px; color: var(--muted); margin-top: 1px; }
.w-day { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #5F6E82; flex: 0 0 auto; }
.w-km { font-size: 12px; font-weight: 800; color: var(--txt-2); flex: 0 0 auto; font-variant-numeric: tabular-nums; }

.rest-row { opacity: 0.45; }

/* Plan setup form */
.field { margin-bottom: 16px; }
.field-label { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: block; }

.segmented {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 4px;
  padding: 4px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--line);
}
.segmented button {
  height: 40px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  transition: all 0.16s ease;
  white-space: nowrap;
}
.segmented button.on { background: var(--volt); color: #0A1205; box-shadow: 0 4px 14px rgba(201, 255, 68, 0.2); }
.segmented button:not(.on):active { background: rgba(255, 255, 255, 0.06); }

/* ---------- Sheet / modals ---------- */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(3, 5, 9, 0.66);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.overlay.show { opacity: 1; pointer-events: auto; }

.sheet {
  position: fixed;
  z-index: 60;
  left: 50%;
  bottom: 0;
  width: 100%;
  max-width: 480px;
  max-height: 90dvh;
  transform: translate(-50%, 102%);
  transition: transform 0.34s cubic-bezier(0.22, 0.61, 0.36, 1);
  background: linear-gradient(180deg, #101823 0%, #0B1119 100%);
  border: 1px solid var(--line-strong);
  border-bottom: 0;
  border-radius: 26px 26px 0 0;
  box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.6);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sheet.open { transform: translate(-50%, 0); }

.sheet-grab { padding: 10px 0 4px; display: grid; place-items: center; flex: 0 0 auto; }
.sheet-grab i { width: 38px; height: 4px; border-radius: 99px; background: rgba(255, 255, 255, 0.18); display: block; }
.sheet-body { overflow-y: auto; padding: 6px 18px calc(22px + var(--safe-b)); scrollbar-width: none; }
.sheet-body::-webkit-scrollbar { display: none; }

.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 4px 2px 14px; }
.sheet-title { font-size: 21px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.2; }
.sheet-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.sheet-close {
  width: 34px; height: 34px; flex: 0 0 auto;
  border-radius: 11px;
  display: grid; place-items: center;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--line);
  color: var(--muted);
}
.sheet-close svg { width: 16px; height: 16px; }

.modal {
  position: fixed;
  z-index: 70;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -46%) scale(0.97);
  width: calc(100% - 40px);
  max-width: 380px;
  border-radius: 24px;
  background: linear-gradient(180deg, #131C29 0%, #0C121A 100%);
  border: 1px solid var(--line-strong);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
  padding: 22px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s ease, transform 0.28s cubic-bezier(0.22, 0.61, 0.36, 1);
}
.modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
.modal-title { font-size: 19px; font-weight: 800; letter-spacing: -0.025em; margin: 0 0 6px; }
.modal-text { font-size: 13.5px; color: var(--muted); line-height: 1.5; margin: 0 0 18px; }
.modal-actions { display: flex; gap: 9px; }
.modal-actions .btn { height: 46px; font-size: 14px; }

/* onboarding */
.onboard-art {
  height: 132px;
  border-radius: 18px;
  overflow: hidden;
  margin-bottom: 18px;
  border: 1px solid var(--line);
  background: #0A1119;
  position: relative;
}
.onboard-art canvas { width: 100%; height: 100%; display: block; }
.onboard-art .oa-label {
  position: absolute; left: 12px; top: 11px;
  font-size: 9.5px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--volt);
}
.onboard-art .oa-dist {
  position: absolute; right: 12px; top: 11px;
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.06em;
  color: rgba(195, 207, 222, 0.7);
  font-variant-numeric: tabular-nums;
}

/* ---------- Run detail ---------- */

.detail-map {
  height: 212px;
  border-radius: var(--r-md);
  overflow: hidden;
  border: 1px solid var(--line);
  background: #0A1119;
  margin-bottom: 14px;
}
.detail-map canvas { width: 100%; height: 100%; display: block; }

.detail-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-bottom: 14px;
}
.dstat {
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  padding: 11px 13px;
}
.dstat .v { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
.dstat .v small { font-size: 10.5px; color: var(--muted); font-weight: 700; margin-left: 2px; }
.dstat .l { font-size: 9.5px; letter-spacing: 0.11em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-top: 2px; }

.split-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
.split-row .si { width: 26px; font-size: 11px; font-weight: 800; color: var(--muted); text-align: right; flex: 0 0 auto; }
.split-row .sbar { flex: 1 1 auto; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.055); overflow: hidden; }
.split-row .sbar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, rgba(201, 255, 68, 0.55), var(--volt)); }
.split-row .st { width: 54px; text-align: right; font-size: 11.5px; font-weight: 700; color: var(--txt-2); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
.split-row .sp { width: 58px; text-align: right; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
.splits-legend { font-size: 10px; color: #5F6E82; text-align: right; padding: 2px 2px 8px; letter-spacing: 0.04em; }
.split-row.best .st { color: var(--volt); }

/* settings */
.setting-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.055);
}
.setting-row:last-child { border-bottom: 0; }
.setting-info { flex: 1 1 auto; min-width: 0; }
.setting-name { font-size: 14px; font-weight: 600; }
.setting-desc { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.setting-control { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; }

.text-input {
  height: 42px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--line-strong);
  padding: 0 13px;
  color: var(--txt);
  font-size: 14px;
  font-weight: 600;
  width: 100%;
}
.text-input:focus { border-color: rgba(201, 255, 68, 0.5); background: rgba(255, 255, 255, 0.07); }

.stepper { display: flex; align-items: center; gap: 3px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); border-radius: 11px; padding: 3px; }

.stepper button:active { background: rgba(255, 255, 255, 0.1); }
.stepper .val { min-width: 46px; text-align: center; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }

.switch {

}

.gap-8 { gap: 8px; }

<script>
/* ===== js/01-core.js ===== */
/* ============================================================
   STRIDE — 01 · CORE
   state, storage, math, formatting, plan engine, insights, audio
   ============================================================ */

"use strict";

const DAY_MS = 86400000;
const STORE_KEY = "stride.state.v1";

const DEFAULT_SETTINGS = {
  name: "",
  units: "km",          // 'km' | 'mi'
  voice: true,
  weightKg: 70,
  weeklyGoalKm: 20,
  demoSpeed: 6
};

let state = {
  settings: { ...DEFAULT_SETTINGS },
  runs: [],
  plan: null,
  onboarded: false
};

let ui = {
  tab: "run",
  detailRunId: null,
  summaryRunId: null,
  pendingTarget: null   // { km, title } when starting a planned workout
};

/* ---------- tiny DOM helpers ---------- */

const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function setHTML(node, html) { node.innerHTML = html; }
function clamp(n, a, b) { return Math.min(b, Math.max(a, n)); }
function round1(n) { return Math.round(n * 10) / 10; }

/* ---------- storage (safe in sandboxed iframes) ---------- */

const _memStore = {};
const store = {
  get(k) {
    try {
      const v = localStorage.getItem(k);
      return v == null ? (_memStore[k] ?? null) : v;
    } catch (e) { return _memStore[k] ?? null; }
  },
  set(k, v) {
    _memStore[k] = v;
    try { localStorage.setItem(k, v); } catch (e) { /* sandboxed / private mode */ }
  },
  del(k) {
    delete _memStore[k];
    try { localStorage.removeItem(k); } catch (e) {}
  }
};

function loadState() {
  let raw = null;
  try { raw = store.get(STORE_KEY); } catch (e) {}
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      state = {
        settings: { ...DEFAULT_SETTINGS, ...(parsed.settings || {}) },
        runs: Array.isArray(parsed.runs) ? parsed.runs : [],
        plan: parsed.plan || null,
        onboarded: !!parsed.onboarded
      };
    } catch (e) { /* corrupt — keep defaults */ }
  }
}

function saveState() {
  try { store.set(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}

/* ---------- formatting ---------- */

function unitDef() {
  return state.settings.units === "mi"
    ? { m: 1609.344, label: "mi", pace: "/mi" }
    : { m: 1000, label: "km", pace: "/km" };
}

function distVal(meters) { return meters / unitDef().m; }
function fmtDist(meters, digits = 2) { return distVal(meters).toFixed(digits); }
function fmtDist1(meters) { return distVal(meters).toFixed(1); }

function pacePerUnit(meters, seconds) {
  if (!meters || !seconds || meters < 1) return null;
  return seconds / (meters / unitDef().m);
}

function fmtPace(secPerUnit) {
  if (!isFinite(secPerUnit) || secPerUnit == null || secPerUnit <= 0) return "--'--\"";
  let m = Math.floor(secPerUnit / 60);
  let s = Math.round(secPerUnit % 60);
  if (s === 60) { m += 1; s = 0; }
  return `${m}'${String(s).padStart(2, "0")}"`;
}

function fmtTime(totalSeconds) {
  const t = Math.max(0, Math.floor(totalSeconds || 0));
  const h = Math.floor(t / 3600);
  const m = Math.floor((t % 3600) / 60);
  const s = t % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function fmtTimeSpeech(totalSeconds) {
  const t = Math.max(0, Math.round(totalSeconds || 0));
  const h = Math.floor(t / 3600);
  const m = Math.floor((t % 3600) / 60);
  const s = t % 60;
  let out = "";
  if (h) out += `${h} hour${h > 1 ? "s" : ""} `;
  if (m) out += `${m} minute${m > 1 ? "s" : ""} `;
  if (s || !out) out += `${s} second${s === 1 ? "" : "s"}`;
  return out.trim();
}

function paceSpeech(secPerUnit) {
  if (!isFinite(secPerUnit) || !secPerUnit) return "";
  const m = Math.floor(secPerUnit / 60);
  const s = Math.round(secPerUnit % 60);
  const unitWord = state.settings.units === "mi" ? "mile" : "kilometer";
  return `${m} minutes ${s} seconds per ${unitWord}`;
}

const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const DAYS_FULL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MONTHS_FULL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

function fmtDate(iso) {
  const d = new Date(iso);
  return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`;
}
function fmtDateFull(iso) {
  const d = new Date(iso);
  return `${DAYS_FULL[d.getDay()]}, ${d.getDate()} ${MONTHS_FULL[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtClock(iso) {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
function monthKey(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${d.getMonth()}`;
}
function monthLabel(iso) {
  const d = new Date(iso);
  const now = new Date();
  const sameYear = d.getFullYear() === now.getFullYear();
  return `${MONTHS_FULL[d.getMonth()]}${sameYear ? "" : " " + d.getFullYear()}`;
}
function timeOfDayName(iso) {
  const h = new Date(iso).getHours();
  if (h >= 5 && h < 12) return "Morning run";
  if (h >= 12 && h < 17) return "Afternoon run";
  if (h >= 17 && h < 21) return "Evening run";
  return "Night run";
}
function isSameDay(a, b) {
  const d1 = new Date(a), d2 = new Date(b);
  return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
}
function mondayOf(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  const offset = (d.getDay() + 6) % 7; // Mon=0
  d.setDate(d.getDate() - offset);
  return d;
}
function dayIndexMon(date) { return (new Date(date).getDay() + 6) % 7; }
function isoDay(date) {
  const d = new Date(date);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------- geo math ---------- */

function haversine(a, b) {
  const R = 6371000;
  const toRad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * toRad;
  const dLng = (b.lng - a.lng) * toRad;
  const s = Math.sin(dLat / 2) ** 2 +
            Math.cos(a.lat * toRad) * Math.cos(b.lat * toRad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
}

/** distance between two consecutive fixes; 0 when the second fix is a GPS gap/anchor */
function segDistM(a, b) {
  if (!a || !b || b.g) return 0;
  return haversine(a, b);
}

function pathDistance(points) {
  let d = 0;
  for (let i = 1; i < points.length; i++) d += segDistM(points[i - 1], points[i]);
  return d;
}

/** run is split into continuous segments wherever the GPS jumped */
function splitSegments(points) {
  const segs = [];
  let cur = [];
  for (const p of points) {
    if (p.g && cur.length) { segs.push(cur); cur = []; }
    cur.push(p);
  }
  if (cur.length) segs.push(cur);
  return segs.filter(s => s.length > 0);
}

/* ---------- splits / records ---------- */

/** splits at every `unitMeters`, using real timestamps (ms) on points */
function computeSplits(points, unitMeters = 1000) {
  const splits = [];
  if (!points || points.length < 2) return { splits, total: 0 };
  let cum = 0;
  let next = unitMeters;
  let segStartT = points[0].t;
  let idx = 1;

  for (let i = 1; i < points.length; i++) {
    const d = segDistM(points[i - 1], points[i]);
    if (!isFinite(d) || d <= 0) continue;
    cum += d;
    while (cum >= next) {
      const frac = clamp((next - (cum - d)) / d, 0, 1);
      const crossT = points[i - 1].t + (points[i].t - points[i - 1].t) * frac;
      splits.push({
        index: idx,
        meters: unitMeters,
        seconds: Math.max(0, (crossT - segStartT) / 1000),
        partial: false
      });
      segStartT = crossT;
      next += unitMeters;
      idx++;
    }
  }
  const lastEnd = points[points.length - 1].t;
  const doneMeters = splits.length * unitMeters;
  const tail = cum - doneMeters;
  if (tail > 60 && lastEnd - segStartT > 5) {
    splits.push({ index: idx, meters: tail, seconds: (lastEnd - segStartT) / 1000, partial: true });
  }
  return { splits, total: cum };
}

/** best rolling segment of `targetMeters` (seconds), or null */
function bestSegment(points, targetMeters) {
  if (!points || points.length < 2) return null;
  const cum = [0];
  for (let i = 1; i < points.length; i++) {
    cum[i] = cum[i - 1] + segDistM(points[i - 1], points[i]);
  }
  if (cum[cum.length - 1] < targetMeters) return null;
  let best = Infinity;
  let i = 0;
  for (let j = 1; j < points.length; j++) {
    while (i < j && cum[j] - cum[i] >= targetMeters) {
      const need = cum[i] + targetMeters;
      const segLen = cum[j] - cum[j - 1];
      const frac = segLen > 0 ? clamp((need - cum[j - 1]) / segLen, 0, 1) : 1;
      const tAt = points[j - 1].t + (points[j].t - points[j - 1].t) * frac;
      const secs = (tAt - points[i].t) / 1000;
      if (secs > 0 && secs < best) best = secs;
      i++;
    }
  }
  return isFinite(best) ? best : null;
}

function elevationGain(points) {
  if (!points || points.length < 4) return 0;
  let gain = 0;
  let prev = null;
  for (const p of points) {
    if (p.g) { prev = null; continue; }
    if (typeof p.alt !== "number" || !isFinite(p.alt)) continue;
    if (prev == null) { prev = p.alt; continue; }
    const delta = p.alt - prev;
    if (Math.abs(delta) > 0.35) {
      if (delta > 0) gain += delta;
      prev = p.alt;
    }
  }
  return gain;
}

function caloriesFor(meters, seconds) {
  const km = meters / 1000;
  const w = clamp(state.settings.weightKg || 70, 35, 180);
  const hours = Math.max(seconds / 3600, km / 22);
  const met = 9.8;
  return Math.round((met * 3.5 * w / 200) * 60 * hours);
}

function runPace(run) { return pacePerUnit(run.distM, run.durS); }

function personalBests() {
  const out = { longest: null, fastest1k: null, fastest5k: null, bestWeek: null };
  for (const r of state.runs) {
    if (!out.longest || r.distM > out.longest.distM) out.longest = r;
    const { splits } = computeSplits(r.points, 1000);
    for (const s of splits) {
      if (s.partial) continue;
      if (!out.fastest1k || s.seconds < out.fastest1k.seconds) out.fastest1k = { seconds: s.seconds, runId: r.id, date: r.date };
    }
    const b5 = bestSegment(r.points, 5000);
    if (b5 && (!out.fastest5k || b5 < out.fastest5k.seconds)) out.fastest5k = { seconds: b5, runId: r.id, date: r.date };
  }
  const weeks = weeklyBuckets(52);
  const withRuns = weeks.filter(w => w.km > 0);
  if (withRuns.length) out.bestWeek = withRuns.reduce((a, b) => (b.km > a.km ? b : a));
  return out;
}

/* ---------- weekly stats / streaks ---------- */

/** km covered between two timestamps (ms) */
function kmInWindow(startMs, endMs) {
  let km = 0;
  for (const r of state.runs) {
    const t = new Date(r.date).getTime();
    if (t >= startMs && t < endMs) km += r.distM / 1000;
  }
  return km;
}

function weeklyBuckets(n = 8) {
  const thisMon = mondayOf(new Date());
  const buckets = [];
  for (let i = n - 1; i >= 0; i--) {
    const start = new Date(thisMon.getTime() - i * 7 * DAY_MS);
    const end = start.getTime() + 7 * DAY_MS;
    let km = 0, runs = 0;
    for (const r of state.runs) {
      const t = new Date(r.date).getTime();
      if (t >= start.getTime() && t < end) { km += r.distM / 1000; runs += 1; }
    }
    buckets.push({ start, km, runs });
  }
  return buckets;
}

function weekStreak() {
  const buckets = weeklyBuckets(52);
  let streak = 0;
  for (let i = buckets.length - 1; i >= 0; i--) {
    if (buckets[i].runs > 0) streak++;
    else if (i === buckets.length - 1) continue; // current week may still be empty
    else break;
  }
  return streak;
}

function consecutiveRunDays() {
  if (!state.runs.length) return 0;
  const days = new Set(state.runs.map(r => isoDay(r.date)));
  let count = 0;
  const d = new Date();
  d.setHours(12, 0, 0, 0);
  if (!days.has(isoDay(d))) d.setDate(d.getDate() - 1);
  while (days.has(isoDay(d))) {
    count++;
    d.setDate(d.getDate() - 1);
  }
  return count;
}

function runsSorted() {
  return [...state.runs].sort((a, b) => new Date(b.date) - new Date(a.date));
}

/* ---------- training plan engine ---------- */

const RACES = {
  "5k":   { key: "5k",   label: "5K",            raceKm: 5,    longStart: 2.5, longPeak: 6 },
  "10k":  { key: "10k",  label: "10K",           raceKm: 10,   longStart: 4,   longPeak: 9 },
  "half": { key: "half", label: "Half Marathon", raceKm: 21.1, longStart: 8,   longPeak: 19 }
};

const LEVELS = {
  beginner: {
    label: "Beginner",
    days: [
      { d: 1, type: "easy" },
      { d: 3, type: "walkrun" },
      { d: 6, type: "long" }
    ]
  },
  intermediate: {
    label: "Intermediate",
    days: [
      { d: 0, type: "easy" },
      { d: 2, type: "intervals" },
      { d: 4, type: "tempo" },
      { d: 6, type: "long" }
    ]
  },
  advanced: {
    label: "Advanced",
    days: [
      { d: 0, type: "easy" },
      { d: 2, type: "intervals" },
      { d: 4, type: "tempo" },
      { d: 5, type: "easy2" },
      { d: 6, type: "long" }
    ]
  }
};

const WORKOUT_META = {
  easy:      { title: "Easy run",           icon: "run",     note: "Conversational effort — you can talk the whole way." },
  easy2:     { title: "Shakeout run",       icon: "run",     note: "Very easy + 4 × 20 s strides to finish." },
  walkrun:   { title: "Walk–run intervals", icon: "timer",   note: "4 min jog / 1 min walk × 5." },
  intervals: { title: "Intervals",          icon: "bolt",    note: "6 × 400 m fast, 90 s walk between." },
  tempo:     { title: "Tempo run",          icon: "trend",   note: "2 km comfortably hard, easy either side." },
  long:      { title: "Long run",           icon: "route",   note: "Easy pace. Steady breathing throughout." },
  race:      { title: "Race day",           icon: "medal",   note: "Start controlled, finish strong." }
};

function workoutKm(type, longKm) {
  let km;
  switch (type) {
    case "easy": km = Math.max(2, longKm * 0.55); break;
    case "easy2": km = Math.max(2, longKm * 0.45); break;
    case "walkrun": km = Math.max(2, longKm * 0.5); break;
    case "intervals": km = Math.max(3, longKm * 0.62); break;
    case "tempo": km = Math.max(3, longKm * 0.7); break;
    default: km = longKm;
  }
  return Math.round(km * 2) / 2;
}

function generatePlan(raceKey, levelKey, weeks, startDate = new Date(), opts = {}) {
  const race = RACES[raceKey];
  const lvl = LEVELS[levelKey];
  const startMonday = mondayOf(startDate);
  const workouts = [];

  // adapt the starting long run to what the runner already does
  let longStart = race.longStart;
  let adaptedFrom = null;
  if (opts.baseLongKm && isFinite(opts.baseLongKm) && opts.baseLongKm > 0.5) {
    adaptedFrom = opts.baseLongKm;
    longStart = clamp(opts.baseLongKm * 1.05, 1.5, race.longPeak * 0.9);
  }

  for (let w = 0; w < weeks; w++) {
    const p = weeks > 1 ? w / (weeks - 1) : 1;
    const isRaceWeek = w === weeks - 1;
    const isTaper = w >= weeks - 2;
    let longKm = longStart + (race.longPeak - longStart) * Math.min(1, p * 1.08);
    if (isRaceWeek) longKm *= 0.55;
    else if (isTaper) longKm *= 0.78;
    longKm = Math.round(longKm * 2) / 2;

    for (const t of lvl.days) {
      if (isRaceWeek && t.type === "long") continue;
      const km = workoutKm(t.type, longKm);
      workouts.push({
        week: w,
        day: t.d,
        type: t.type,
        title: WORKOUT_META[t.type].title,
        km,
        note: WORKOUT_META[t.type].note
      });
    }
    if (isRaceWeek) {
      workouts.push({
        week: w,
        day: 6,
        type: "race",
        title: `Race day — ${race.label}`,
        km: race.raceKm,
        note: WORKOUT_META.race.note
      });
    }
  }

  workouts.sort((a, b) => a.week - b.week || a.day - b.day);
  return {
    id: "plan_" + Date.now().toString(36),
    race: raceKey,
    level: levelKey,
    weeks,
    startISO: startMonday.toISOString(),
    workouts,
    done: {},
    adaptedFrom
  };
}

function workoutKey(w) { return `${w.week}-${w.day}`; }

function planWeekIndex(plan) {
  if (!plan) return null;
  const start = mondayOf(new Date(plan.startISO)).getTime();
  const now = mondayOf(new Date()).getTime();
  return Math.floor((now - start) / (7 * DAY_MS));
}

function planWeekMeta(plan, weekIdx) {
  const isRaceWeek = weekIdx === plan.weeks - 1;
  const isTaper = weekIdx >= plan.weeks - 2;
  if (isRaceWeek) return { label: "Race week", cls: "race" };
  if (isTaper) return { label: "Taper", cls: "taper" };
  if (weekIdx < Math.floor(plan.weeks * 0.4)) return { label: "Base", cls: "" };
  if (weekIdx < Math.floor(plan.weeks * 0.8)) return { label: "Build", cls: "" };
  return { label: "Peak", cls: "" };
}

function todayWorkout() {
  const plan = state.plan;
  if (!plan) return null;
  const wi = planWeekIndex(plan);
  if (wi < 0 || wi >= plan.weeks) return null;
  const di = dayIndexMon(new Date());
  const w = plan.workouts.find(x => x.week === wi && x.day === di);
  return w ? { workout: w, weekIndex: wi } : { workout: null, weekIndex: wi };
}

function planProgress(plan) {
  const total = plan.workouts.length;
  const done = plan.workouts.filter(w => plan.done[workoutKey(w)]).length;
  return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
}

function markWorkoutDoneAuto(run) {
  const plan = state.plan;
  if (!plan) return null;
  const wi = planWeekIndex(plan);
  if (wi < 0 || wi >= plan.weeks) return null;
  const di = dayIndexMon(run.date);
  const w = plan.workouts.find(x => x.week === wi && x.day === di);
  if (!w || w.type === "race") return null;
  const key = workoutKey(w);
  if (plan.done[key]) return null;
  if (run.distM >= w.km * 1000 * 0.7) {
    plan.done[key] = true;
    saveState();
    return w;
  }
  return null;
}

/* ---------- insights ---------- */

function buildInsights(limit = 4) {
  const out = [];
  const buckets = weeklyBuckets(8);
  const cur = buckets[buckets.length - 1];
  const prev = buckets[buckets.length - 2];
  const goalKm = state.settings.weeklyGoalKm;

  if (state.runs.length === 0) {
    return [{
      icon: "sparkle",
      title: "Your first run is the hardest",
      text: "Start a run or try demo mode to see how tracking works."
    }, {
      icon: "target",
      title: `Weekly goal: ${fmtDist1(goalKm * 1000)} ${unitDef().label}`,
      text: "You can change this any time in settings."
    }];
  }

  if (cur.km > 0 && prev.km > 0.1) {
    // compare like for like: this week so far vs last week up to the same weekday
    const dayOfWeek = dayIndexMon(new Date()) + 1;         // 1 = Monday
    const prevPartial = kmInWindow(prev.start.getTime(), prev.start.getTime() + dayOfWeek * DAY_MS);
    if (prevPartial > 0.1) {
      const pct = Math.round(((cur.km - prevPartial) / prevPartial) * 100);
      const title = Math.abs(pct) < 3
        ? "On pace with last week"
        : pct > 0 ? `${pct}% ahead of last week` : `${Math.abs(pct)}% behind last week`;
      out.push({
        icon: "trend",
        title,
        text: `${fmtDist1(cur.km * 1000)} ${unitDef().label} so far, vs ${fmtDist1(prevPartial * 1000)} ${unitDef().label} by this day last week.`
      });
    } else {
      out.push({
        icon: "trend",
        title: "Week in motion",
        text: `${fmtDist1(cur.km * 1000)} ${unitDef().label} logged across ${cur.runs} run${cur.runs === 1 ? "" : "s"} this week.`
      });
    }
  } else if (cur.km > 0) {
    out.push({
      icon: "trend",
      title: "Week in motion",
      text: `${fmtDist1(cur.km * 1000)} ${unitDef().label} logged across ${cur.runs} run${cur.runs === 1 ? "" : "s"} this week.`
    });
  }

  const sorted = runsSorted().filter(r => r.durS > 60 && r.distM > 400);
  if (sorted.length >= 4) {
    const recent = sorted.slice(0, 3);
    const older = sorted.slice(3, 6);
    if (older.length >= 2) {
      const rp = avgPace(recent);
      const op = avgPace(older);
      if (rp && op) {
        const diff = Math.round(op - rp);
        if (Math.abs(diff) >= 3) {
          out.push({
            icon: "bolt",
            title: diff > 0 ? `${diff}s faster per ${unitDef().label}` : `${Math.abs(diff)}s slower recently`,
            text: diff > 0
              ? "Your last 3 runs are quicker than the 3 before. Fitness is building — keep easy runs easy."
              : "Recent runs are slower — that's fine. Check sleep, recovery and effort level."
          });
        }
      }
    }
  }

  const gap = goalKm - cur.km;
  if (gap > 0.3) {
    out.push({
      icon: "target",
      title: `${fmtDist1(gap * 1000)} ${unitDef().label} to your weekly goal`,
      text: "One easy run closes the gap. Small and consistent beats one big day."
    });
  } else if (cur.km > 0) {
    out.push({
      icon: "medal",
      title: "Weekly goal complete",
      text: "Everything from here is a bonus. Keep the next run relaxed."
    });
  }

  const cons = consecutiveRunDays();
  if (cons >= 3) {
    out.push({
      icon: "heart",
      title: `${cons} days in a row`,
      text: "Recovery is where you get stronger. Consider an easy day or rest."
    });
  }

  const tw = todayWorkout();
  if (tw && tw.workout && tw.workout.type !== "race") {
    out.push({
      icon: "calendar",
      title: `Today: ${tw.workout.title}`,
      text: `${fmtDist1(tw.workout.km * 1000)} ${unitDef().label} planned. Tap Start to run it with target prompts.`
    });
  }

  const seen = new Set();
  return out.filter(i => {
    if (seen.has(i.title)) return false;
    seen.add(i.title);
    return true;
  }).slice(0, limit);
}

function avgPace(runs) {
  let m = 0, s = 0;
  for (const r of runs) { m += r.distM; s += r.durS; }
  return m > 0 ? pacePerUnit(m, s) : null;
}

/* ---------- audio ---------- */

let _audioCtx = null;
function beep(freq = 880, dur = 0.09, gain = 0.045) {
  try {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = _audioCtx.currentTime;
    const o = _audioCtx.createOscillator();
    const g = _audioCtx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(_audioCtx.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  } catch (e) {}
}

function speak(text) {
  if (!state.settings.voice) return;
  try {
    if (!("speechSynthesis" in window)) return;
    const synth = window.speechSynthesis;
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.03;
    u.pitch = 1.0;
    u.lang = "en-US";
    const voices = synth.getVoices() || [];
    const pick = voices.find(v => /^en[-_]/i.test(v.lang) && /google|samantha|aria|jenny|zira/i.test(v.name)) ||
                 voices.find(v => /^en[-_]/i.test(v.lang));
    if (pick) u.voice = pick;
    synth.cancel();
    synth.speak(u);
  } catch (e) {}
}

/* ---------- toast & dialog ---------- */

let _toastTimer = null;
function toast(msg, ms = 2400) {
  const el = $("#toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove("show"), ms);
}

function showDialog({ title, text, actions }) {
  const root = $("#modalDialog");
  root.innerHTML = `
    <h3 class="modal-title">${escapeHtml(title)}</h3>
    <p class="modal-text">${escapeHtml(text)}</p>
    <div class="modal-actions">
      ${actions.map((a, i) => `<button class="btn ${a.style || "btn-ghost"}" data-act="${i}">${escapeHtml(a.label)}</button>`).join("")}
    </div>`;
  actions.forEach((a, i) => {
    root.querySelector(`[data-act="${i}"]`).addEventListener("click", () => {
      closeDialog();
      if (typeof a.onClick === "function") a.onClick();
    });
  });
  $("#overlay").classList.add("show");
  root.classList.add("open");
}

function closeDialog() {
  const root = $("#modalDialog");
  root.classList.remove("open");
  if (!$("#modalOnboard").classList.contains("open") &&
      !$$(".sheet.open").length) {
    $("#overlay").classList.remove("show");
  }
}

/** longest run in the last N days, in km (for adapting plan difficulty) */
function recentLongestKm(days = 28) {
  const cutoff = Date.now() - days * DAY_MS;
  const recent = state.runs.filter(r => new Date(r.date).getTime() >= cutoff);
