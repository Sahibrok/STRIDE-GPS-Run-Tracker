<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>STRIDE — GPS Run Tracker</title>
  <meta name="description" content="STRIDE is a GPS run tracker with live route maps, splits, pace analysis, training plans and a built-in coach. Works offline, no account needed.">
  <meta name="theme-color" content="#06090E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="STRIDE">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">
  <!-- ======= Top bar ======= -->
  <header class="topbar" id="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px">
          <path d="M4 16.5 9 10l3.4 3.6L20 5.5"/>
          <path d="M4 20h16"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">STRIDE</div>
        <div class="brand-sub">GPS Run Tracker</div>
      </div>
    </div>
    <div class="top-actions">
      <div class="chip-streak zero" id="streakChip"></div>
      <button class="icon-btn" data-act="open-settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7.5h9"/><path d="M17.5 7.5H20"/><circle cx="15" cy="7.5" r="2.3"/>
          <path d="M4 16.5h3.5"/><path d="M12 16.5h8"/><circle cx="9.5" cy="16.5" r="2.3"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ======= Screens ======= -->
  <main id="main">
    <section class="screen active" id="screen-run">
      <div id="runIdle"></div>
    </section>

    <section class="screen" id="screen-history">
      <div id="historyBody"></div>
    </section>

    <section class="screen" id="screen-stats">
      <div id="statsBody"></div>
    </section>

    <section class="screen" id="screen-plan">
      <div id="planBody"></div>
    </section>

    <!-- Live running view -->
    <section class="screen" id="screen-live">
      <div class="run-live">
        <div class="live-head">
          <span class="live-dot" id="liveDot"></span>
          <span class="live-label">Recording</span>
          <span class="spacer"></span>
          <span class="badge badge-gps warn" id="liveModeBadge">Locating…</span>
          <div class="speed-switch" id="speedSwitch">
            <button data-mult="1" class="on">1×</button>
            <button data-mult="2">2×</button>
            <button data-mult="4">4×</button>
          </div>
        </div>

        <div class="live-target hidden" id="liveTarget"></div>

        <div class="map-wrap">
          <canvas id="liveMap"></canvas>
        </div>

        <div class="live-panel">
          <div class="live-main">
            <div class="live-dist num" id="liveDist">0.00</div>
            <span class="live-unit" id="liveUnit">KM</span>
          </div>
          <div class="live-substats">
            <div class="live-substat">
              <div class="v num" id="liveTime">00:00</div>
              <div class="l">Time</div>
            </div>
            <div class="live-substat">
              <div class="v num" id="livePace">--'--"</div>
              <div class="l">Avg pace</div>
            </div>
          </div>
          <div class="live-extras">
            <span><b id="liveSplits">0</b> splits</span>
            <span><b id="liveCal">0</b> kcal</span>
            <span><b id="liveGain">0</b> m gain</span>
          </div>
          <div class="last-split" id="lastSplit">Waiting for first split</div>
          <div class="next-cue" id="nextCue"></div>
        </div>

        <div class="live-controls">
          <button class="ctrl ctrl-pause" id="ctrlPause" data-act="toggle-pause">
            <svg viewBox="0 0 24 24" fill="none"><rect x="6.8" y="4.8" width="3.8" height="14.4" rx="1.5" fill="currentColor"/><rect x="13.4" y="4.8" width="3.8" height="14.4" rx="1.5" fill="currentColor"/></svg>
            <span>Pause</span>
          </button>
          <button class="ctrl ctrl-finish" data-act="finish-run">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 21V4"/><path d="M5.5 4.6h9.8l-1.7 3.4 1.7 3.4H5.5"/></svg>
            <span>Finish</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- ======= Tab bar ======= -->
  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="run">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12.5h3.4l2.4 6.4 4.1-13.4 2.5 7h5.6"/></svg>
      <span>Run</span>
    </button>
    <button class="tab" data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.4V12l3.1 1.9"/></svg>
      <span>History</span>
    </button>
    <button class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7.4 15.2l3.4-4 2.9 2.4 4.9-6"/></svg>
      <span>Progress</span>
    </button>
    <button class="tab" data-tab="plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.6" width="16" height="14.6" rx="3.2"/><path d="M8.2 3.6v4M15.8 3.6v4M4 10.7h16"/></svg>
      <span>Plan</span>
    </button>
  </nav>
</div>

<!-- ======= Overlay, sheets, modals ======= -->
<div class="overlay" id="overlay"></div>

<div class="sheet" id="sheetDetail" role="dialog" aria-modal="true" aria-label="Run details">
  <div class="sheet-grab"><i></i></div>
  <div class="sheet-body" id="sheetDetailBody"></div>
</div>

<div class="sheet" id="sheetSummary" role="dialog" aria-modal="true" aria-label="Run saved">
  <div class="sheet-grab"><i></i></div>
  <div class="sheet-body" id="sheetSummaryBody"></div>
</div>

<div class="sheet" id="sheetPlan" role="dialog" aria-modal="true" aria-label="Training plan">
  <div class="sheet-grab"><i></i></div>
  <div class="sheet-body" id="sheetPlanBody"></div>
</div>

<div class="sheet" id="sheetSettings" role="dialog" aria-modal="true" aria-label="Settings">
  <div class="sheet-grab"><i></i></div>
  <div class="sheet-body" id="sheetSettingsBody"></div>
</div>

<div class="modal" id="modalDialog" role="dialog" aria-modal="true"></div>
<div class="modal onboard-modal" id="modalOnboard" role="dialog" aria-modal="true" aria-label="Welcome to STRIDE"></div>

<div class="paused-veil hidden" id="pausedVeil">
  <div class="inner">
    <div class="pt">Run paused</div>
    <div class="ps">Time is on hold. Your route is safe.</div>
    <div style="display:flex;gap:10px;margin-top:20px;justify-content:center">
      <button class="btn btn-primary" style="width:auto;padding:0 24px" data-act="resume-run">Resume</button>
      <button class="btn btn-ghost" style="width:auto;padding:0 24px" data-act="finish-run">Finish</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/01-core.js"></script>
<script src="js/02-tracker.js"></script>
<script src="js/03-ui.js"></script>
<script src="js/04-app.js"></script>

</html>
